/* ---------- stat strip ---------- */
function statStrip(s){
  const cell = (k,v,tip,hero)=>`<div class="stat${hero?' hero':''}">
    <span class="k">${k}${tip?help(tip):''}</span><span class="v">${v}</span></div>`;
  const cov = s.bipTot ? `<small> ${s.bipTag}/${s.bipTot} tagged</small>` : '';
  return `<div class="stats">
    ${cell('PA', s.PA)}
    ${cell('AVG', avg3(s.AVG))}
    ${cell('OBP', avg3(s.OBP))}
    ${cell('SLG', avg3(s.SLG))}
    ${cell('OPS', avg3(s.OPS))}
    ${cell('wOBA', avg3(s.wOBA), 'One number for total offensive value, on the same scale as on-base percentage. A walk, a single and a homer are each worth what they actually produce, instead of a walk counting as nothing. Around .320 is average, .400 is excellent. Uses '+WOBA_SCALE_NOTE+'.', true)}
    ${cell('xwOBA', (s.xwOBA==null?'--':avg3(s.xwOBA))+cov, 'What the contact was worth based on how hard and at what angle it was hit, not where it landed. It strips out luck and defense. Only balls with an exit velocity entered are included -- the "tagged" figure tells you how much of the sample that is.', true)}
    ${cell('ISO', avg3(s.ISO), 'Slugging minus batting average -- raw extra-base power, with singles taken out.')}
    ${cell('BABIP', avg3(s.BABIP), 'Batting average on balls put in play, excluding homers. Well above .350 over a season usually means good luck rather than a new skill.')}
    ${cell('K%', pct(s.Kpct,0), 'Share of plate appearances ending in a strikeout.')}
    ${cell('BB%', pct(s.BBpct,0), 'Share of plate appearances ending in a walk.')}
  </div>`;
}

function disciplineTable(s){
  const rows = [
    ['Pitches seen', s.pitches, null, 'Every pitch logged for this hitter in the current filter.'],
    ['Zone rate', pct(s.ZoneSeen), null, 'Share of pitches thrown in the strike zone. Low means pitchers are working around this hitter -- respect, or a pattern to punish.'],
    ['Swing %', pct(s.Swing), null, 'How often the hitter swings at anything.'],
    ['Z-Swing %', pct(s.ZSwing), 'high', 'How often the hitter swings at strikes. You want this high -- taking hittable strikes gives away the at-bat.'],
    ['Chase %', pct(s.Chase), 'low', 'How often the hitter swings at pitches outside the zone. The single most coachable number here. Lower is better.'],
    ['In-zone take %', pct(s.ZTake), 'low', 'Strikes the hitter let go by. Some are unhittable edges; a high number usually means passivity.'],
    ['Contact %', pct(s.Contact), 'high', 'Of all swings, how many touched the ball.'],
    ['Whiff %', pct(s.Whiff), 'low', 'Of all swings, how many missed entirely.'],
    ['Swing-strike %', pct(s.SwStr), 'low', 'Misses as a share of every pitch seen, not just swings.'],
    ['First-pitch swing %', pct(s.FPSwing), null, 'How aggressive the hitter is on 0-0.'],
    ['Avg exit velo', s.EV==null?'--':n1(s.EV)+' mph', 'high', 'Average exit velocity on balls in play where one was entered.'],
    ['xwOBA on contact', s.xwOBAcon==null?'--':avg3(s.xwOBAcon), 'high', 'Expected value of the contact this hitter makes, from exit velocity and launch angle. Ignores walks and strikeouts -- it is a pure quality-of-contact number.'],
    ['Decision runs / 100', sgn1(s.DecRuns), 'high', 'Runs gained or lost per 100 pitches by the swing-or-take decision alone. Taking a ball gains, taking a strike or chasing loses. It credits the decision, not the result -- every ball in play in the same count scores identically, because the hitter cannot control where it lands.'],
  ];
  return `<div class="tw"><table><thead><tr><th>Plate discipline</th><th>Value</th><th>Better</th></tr></thead>
    <tbody>${rows.map(([k,v,dir,tip])=>`<tr>
      <td>${k} ${tip?help(tip):''}</td><td class="n">${v}</td>
      <td class="mut" style="font-size:11px">${dir==='high'?'higher':dir==='low'?'lower':'--'}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

/* ---------- heat map panel ---------- */
function heatPanel(pitches, title){
  const g = heatGrid(pitches, S.hmMetric);
  const M = g.metric;
  const lo = IZ_LO/GRID*100, hi = (IZ_HI+1)/GRID*100;
  const cells = g.cells.map(c=>{
    const tip = `${c.n} pitch${c.n===1?'':'es'}`+(c.v!=null&&!c.thin?` -- ${M.fmt(c.v)}`:'');
    return `<div style="background:${heatColor(c.thin?null:c.v,g)}" class="${c.thin?'hatch':''}" title="${tip}"></div>`;
  }).join('');
  return `<div class="panel">
    <header><h3>${title}</h3><span class="sub">${g.total} pitches</span></header>
    <div class="row" style="margin-bottom:11px">
      <div class="seg">${Object.entries(HM_METRICS).map(([k,v])=>
        `<button data-act="hm" data-v="${k}" aria-pressed="${S.hmMetric===k}">${v.label}</button>`).join('')}</div>
      ${help(M.tip)}
    </div>
    <div class="hmwrap">
      <div class="hm">${cells}</div>
      <div class="szbox" style="left:${lo}%;top:${lo}%;width:${hi-lo}%;height:${hi-lo}%">${SZ9}</div>
    </div>
    <div class="hmlegend">
      <span>${M.type==='div'?'worse':'low'}</span>
      <span class="bar" style="background:${RAMP_CSS}"></span>
      <span>${M.type==='div'?'better':'high'}</span>
    </div>
    <p class="note" style="margin:8px 0 0">Viewed from behind the catcher. The white box is the strike zone.
      Hatched cells have too few pitches to color yet -- they are not cold, just unknown.
      Values are smoothed across neighbouring cells; hover a cell for its raw pitch count.</p>
  </div>`;
}

/* ---------- spray panel ---------- */
function sprayPanel(pitches){
  const bip = pitches.filter(p=>p.decision==='in_play');
  const pts = bip.filter(p=>p.spray && p.spray.x!=null).map(p=>({
    x:p.spray.x, y:p.spray.y, res:p.result, hitFlag: RES[p.result]?.hit,
  }));
  const hits = bip.filter(p=>RES[p.result]?.hit).length;
  const dists = bip.filter(p=>p.dist!=null&&isFinite(p.dist)).map(p=>p.dist);
  return `<div class="panel">
    <header><h3>Spray chart</h3>
      <span class="sub">${pts.length} of ${bip.length} balls in play located</span></header>
    ${pts.length?fieldHTML(pts,false):`<div class="empty">No located balls in play in this filter.<br>
      Tap the field when you log a ball in play and they show up here.</div>`}
    <div class="row" style="margin-top:11px;gap:18px">
      <span class="note">Balls in play <b class="num">${bip.length}</b></span>
      <span class="note">Hits <b class="num">${hits}</b></span>
      ${dists.length?`<span class="note">Max distance <b class="num">${Math.max(...dists)} ft</b></span>`:''}
    </div>
    <p class="note" style="margin:8px 0 0">Gold is a hit, bright gold a home run, grey an out. Arcs are 200 and 300 feet.</p>
  </div>`;
}

/* ---------- count matrix ---------- */
function countMatrix(pitches){
  const f = S.filters;
  const cell = (b,s)=>{
    const ps = pitches.filter(p=>p.balls===b&&p.strikes===s);
    const d = discipline(ps);
    const key = b+'-'+s;
    return `<button data-act="filter" data-k="count" data-v="${key}" aria-pressed="${f.count===key}">
      ${ps.length?pct(d.ZoneSeen,0):'--'}<span class="sm">${key} &middot; ${ps.length}p</span></button>`;
  };
  return `<div class="panel">
    <header><h3>How they're pitched, by count</h3>
      ${help('Each cell is the share of pitches thrown in the strike zone in that count, with the pitch count underneath. A low number means pitchers expand the zone on this hitter in that count. Click any cell to filter every panel on this page to it.')}
      <span class="sub">zone % &middot; click to filter</span></header>
    <div class="cmx">
      <div class="h"></div><div class="h">0 str</div><div class="h">1 str</div><div class="h">2 str</div>
      ${[0,1,2,3].map(b=>`<div class="h">${b} ball${b===1?'':'s'}</div>${[0,1,2].map(s=>cell(b,s)).join('')}`).join('')}
    </div>
  </div>`;
}

/* ---------- PA log ---------- */
function paLog(pitches, athleteId){
  const pas = derivePAs(pitches).filter(pa=>!athleteId||pa.athleteId===athleteId).reverse();
  if(!pas.length) return '';
  return `<div class="panel">
    <header><h3>Plate appearances</h3><span class="sub">${pas.length} logged, newest first</span></header>
    <div class="tw"><table><thead><tr>
      <th>Date</th><th>Opponent</th><th>Result</th><th>Pitches</th><th>Sequence</th><th>EV</th><th>Dist</th>
    </tr></thead><tbody>${pas.slice(0,80).map(pa=>{
      const g = game(pa.gameId);
      const seq = pa.pitches.map(p=>{
        const a = advanceCount(p);
        return `<span class="p ${p.decision==='in_play'?'bip':(p.decision!=='taken'?'sw':'')}">${p.pitchType} ${decShort(p)}</span>`;
      }).join(' ');
      return `<tr>
        <td>${fmtDate(pa.date)}</td>
        <td>${esc(g?.opponent||'--')} ${pa.gameType==='scrimmage'?'<span class="pill type-scrimmage">scrim</span>':''}</td>
        <td><b>${pa.outcome||'in progress'}</b></td>
        <td class="n">${pa.pitches.length}</td>
        <td><div class="seqlog">${seq}</div></td>
        <td class="n">${pa.last.ev!=null?n1(pa.last.ev):'--'}</td>
        <td class="n">${pa.last.dist!=null?pa.last.dist:'--'}</td>
      </tr>`;
    }).join('')}</tbody></table></div>
  </div>`;
}

/* ============================================================
   HITTER PAGE
   ============================================================ */
function viewHitter(){
  if(!S.athletes.length) return `<div class="empty">No hitters yet. Add them on the Roster tab.</div>`;
  // A selection can go stale if the roster changed on another device.
  if(S.athleteId && !athlete(S.athleteId)) S.athleteId = null;
  const id = S.athleteId || S.athletes[0].id;
  const a = athlete(id);
  const mine = S.pitches.filter(p=>p.athleteId===id);
  const f = S.filters;
  const ps = filterPitches(mine, f);
  const s = withOPS(computeStats(ps, id));
  const label = f.gameType==='both' ? 'games and scrimmages' : (f.gameType==='game' ? 'games only' : 'scrimmages only');

  return `<div class="col">
    <div class="panel">
      <div class="row" style="gap:16px;align-items:flex-end">
        <label class="field" style="min-width:230px"><span>Hitter</span>
          <select data-act="pick-athlete">${S.athletes.map(x=>
            `<option value="${x.id}"${x.id===id?' selected':''}>${esc(x.name)}${x.number?' #'+esc(x.number):''}</option>`).join('')}</select>
        </label>
        <div>
          <span class="eyebrow">${esc(a.bats||'R')}HH &middot; ${esc(a.classYear||'--')} &middot; ${esc(a.positions||'--')}</span>
          <h2 style="margin-top:2px">${esc(a.name)}</h2>
        </div>
        <span class="note" style="margin-left:auto">Showing <b>${label}</b> &middot; ${ps.length} pitches
          ${f.count!=='all'?' &middot; count '+esc(COUNT_GROUPS[f.count]?.label||f.count):''}</span>
      </div>
    </div>
    ${filterBar()}
    ${ps.length?`
      ${statStrip(s)}
      <div class="grid2">
        ${heatPanel(ps, 'Zone profile')}
        ${sprayPanel(ps)}
      </div>
      <div class="grid2">
        <div class="panel">${disciplineTable(s)}</div>
        ${countMatrix(ps)}
      </div>
      ${paLog(ps, id)}
    `:emptyHitter(a, mine, f)}
  </div>`;
}

/* An empty page should say WHY it is empty and offer the fix. The common case
   is real data sitting in scrimmages while the page defaults to games only. */
function emptyHitter(a, mine, f){
  if(!mine.length) return `<div class="empty">No pitches logged for ${esc(a.name)} yet.<br>
    Track a game on the <b>Live Game</b> tab and this page fills in.</div>`;
  const games = mine.filter(p=>p.gameType==='game').length;
  const scrims = mine.filter(p=>p.gameType==='scrimmage').length;
  const other = f.gameType==='game' ? scrims : games;
  const otherLabel = f.gameType==='game' ? 'scrimmages' : 'games';
  const otherVal = f.gameType==='game' ? 'scrimmage' : 'game';
  const narrowed = f.count!=='all' || f.pt!=='all' || f.hand!=='all' || f.from || f.to || f.gameId;
  return `<div class="empty">
    <div style="font-size:14px;color:var(--slate-100);margin-bottom:6px">
      Nothing matches this filter for ${esc(a.name)}.</div>
    <div style="margin-bottom:14px">${esc(a.name)} has
      <b class="num">${games}</b> pitch${games===1?'':'es'} in games and
      <b class="num">${scrims}</b> in scrimmages.</div>
    <div class="row" style="justify-content:center">
      ${f.gameType!=='both' && other>0 ? `<button class="btn primary sm" data-act="filter" data-k="gameType"
        data-v="${otherVal}">Show ${otherLabel} (${other})</button>` : ''}
      ${f.gameType!=='both' ? `<button class="btn sm" data-act="filter" data-k="gameType" data-v="both">Show both</button>`:''}
      ${narrowed ? `<button class="btn ghost sm" data-act="filter-reset">Clear all filters</button>`:''}
    </div>
  </div>`;
}

/* ============================================================
   TEAM PAGE
   ============================================================ */
function viewTeam(){
  const f = S.filters;
  const all = filterPitches(S.pitches, f);
  const rows = S.athletes.map(a=>{
    const ps = all.filter(p=>p.athleteId===a.id);
    return {a, ps, s: withOPS(computeStats(ps, a.id))};
  }).filter(r=>r.ps.length);
  const sortKey = S.teamSort || 'PA';
  rows.sort((x,y)=>{
    const va = x.s[sortKey], vb = y.s[sortKey];
    if(va==null) return 1; if(vb==null) return -1;
    return vb-va;
  });
  const teamPs = all;
  const ts = withOPS(computeStats(teamPs));
  const cols = [['PA','PA'],['AVG','AVG'],['OBP','OBP'],['SLG','SLG'],['wOBA','wOBA'],['xwOBA','xwOBA'],
    ['Kpct','K%'],['BBpct','BB%'],['Chase','Chase'],['ZSwing','Z-Sw'],['Whiff','Whiff'],['EV','Avg EV'],['DecRuns','Dec runs']];
  const fmt = (k,v)=>{
    if(v==null) return '--';
    if(['AVG','OBP','SLG','wOBA','xwOBA'].includes(k)) return avg3(v);
    if(['Kpct','BBpct','Chase','ZSwing','Whiff'].includes(k)) return pct(v,0);
    if(k==='EV') return n1(v);
    if(k==='DecRuns') return sgn1(v);
    return v;
  };
  return `<div class="col">
    <div class="panel"><header><h2>Team</h2>
      <span class="sub">${f.gameType==='both'?'games and scrimmages':f.gameType+'s only'} &middot; ${all.length} pitches</span></header>
      ${statStrip(ts)}
    </div>
    ${filterBar()}
    ${!rows.length && S.pitches.length ? `<div class="empty">
      <div style="font-size:14px;color:var(--slate-100);margin-bottom:6px">Nothing matches this filter.</div>
      <div style="margin-bottom:14px">You have
        <b class="num">${S.pitches.filter(p=>p.gameType==='game').length}</b> pitches in games and
        <b class="num">${S.pitches.filter(p=>p.gameType==='scrimmage').length}</b> in scrimmages.</div>
      <div class="row" style="justify-content:center">
        <button class="btn primary sm" data-act="filter" data-k="gameType" data-v="both">Show both</button>
        <button class="btn ghost sm" data-act="filter-reset">Clear all filters</button>
      </div></div>` : ''}
    ${rows.length?`<div class="panel">
      <header><h3>Hitters</h3><span class="sub">click a row for the full profile &middot; click a header to sort</span></header>
      <div class="tw"><table><thead><tr><th>Hitter</th>
        ${cols.map(([k,l])=>`<th data-act="team-sort" data-k="${k}">${l}${sortKey===k?' &darr;':''}</th>`).join('')}
      </tr></thead><tbody>${rows.map(r=>`<tr class="clickable" data-act="goto-hitter" data-id="${r.a.id}">
        <td><b>${esc(r.a.name)}</b> <span class="mut">${esc(r.a.bats||'R')}HH</span></td>
        ${cols.map(([k])=>`<td class="n">${fmt(k, r.s[k])}</td>`).join('')}
      </tr>`).join('')}</tbody></table></div>
    </div>
    <div class="grid2">
      ${heatPanel(all, 'How the team is pitched')}
      <div class="panel"><header><h3>Team pitch mix</h3>
        ${help('What the staff is throwing your lineup, overall and in the count you have selected. A fastball-heavy mix in hitter counts is a plan you can attack.')}</header>
        ${pitchMixTable(all)}
      </div>
    </div>
    ${countMatrix(all)}
    `:(S.pitches.length?'':`<div class="empty">No pitches logged yet.<br>
       Start a game on the <b>Live Game</b> tab.</div>`)}
  </div>`;
}

function pitchMixTable(pitches){
  const seen = PITCH_TYPES.filter(t=>pitches.some(p=>p.pitchType===t.code));
  if(!seen.length) return `<div class="empty">Nothing logged yet.</div>`;
  return `<div class="tw"><table><thead><tr><th>Pitch</th><th>Count</th><th>Share</th><th>Zone%</th><th>Swing%</th><th>Whiff%</th><th>Avg EV</th></tr></thead>
    <tbody>${seen.map(t=>{
      const ps = pitches.filter(p=>p.pitchType===t.code);
      const d = discipline(ps);
      return `<tr><td>${esc(t.name)}</td><td class="n">${ps.length}</td>
        <td class="n">${pct(ps.length/pitches.length,0)}</td>
        <td class="n">${pct(d.ZoneSeen,0)}</td><td class="n">${pct(d.Swing,0)}</td>
        <td class="n">${pct(d.Whiff,0)}</td><td class="n">${d.EV==null?'--':n1(d.EV)}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

/* ============================================================
   GAMES + GAME REPORT
   ============================================================ */
function viewGames(){
  if(S.reportGameId) return gameReport(S.reportGameId);
  const games = S.games.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!games.length) return `<div class="empty">No games yet. Start one on the Live Game tab.</div>`;
  return `<div class="col"><div class="panel">
    <header><h2>Games</h2><span class="sub">${games.length} logged</span></header>
    <div class="tw"><table><thead><tr><th>Date</th><th>Opponent</th><th>Type</th><th>Sides</th>
      <th>Pitches</th><th>PA</th><th>Status</th><th></th></tr></thead>
    <tbody>${games.map(g=>{
      const ps = gamePitches(g.id);
      return `<tr>
        <td class="clickable" data-act="open-report" data-id="${g.id}">${fmtDate(g.date)}</td>
        <td class="clickable" data-act="open-report" data-id="${g.id}">${esc(g.opponent||'--')}</td>
        <td><span class="pill ${g.gameType==='scrimmage'?'type-scrimmage':'gold'}">${g.gameType}</span></td>
        <td class="n">${g.lineupMode==='dual'?'2':'1'}</td>
        <td class="n">${ps.length}</td>
        <td class="n">${derivePAs(ps).filter(p=>p.complete).length}</td>
        <td>${g.status==='live'?'<span class="pill live">live</span>':'<span class="mut">final</span>'}</td>
        <td style="text-align:right"><div class="row tight" style="justify-content:flex-end">
          <button class="btn ghost sm" data-act="open-report" data-id="${g.id}">Report</button>
          <button class="btn danger sm" data-act="delete-game" data-id="${g.id}">Delete</button>
        </div></td></tr>`;
    }).join('')}</tbody></table></div>
  </div></div>`;
}

function gameReport(gid){
  const g = game(gid);
  if(!g) return `<div class="empty">Game not found.</div>`;
  const ps = gamePitches(gid);
  const sides = sidesOf(g);
  const byAthlete = new Map();
  for(const p of ps){
    if(!byAthlete.has(p.athleteId)) byAthlete.set(p.athleteId, []);
    byAthlete.get(p.athleteId).push(p);
  }
  const blocks = [...byAthlete.entries()].map(([id, list])=>{
    const s = withOPS(computeStats(list, id));
    const pas = derivePAs(list).filter(pa=>pa.athleteId===id);
    const chases = list.filter(p=>!p.inZone && p.decision!=='taken' && p.decision!=='hbp');
    const ztakes = list.filter(p=>p.inZone && p.decision==='taken');
    return `<div class="panel">
      <header><h3>${esc(aName(id))}</h3>
        <span class="sub">${pas.filter(p=>p.complete).length} PA &middot; ${list.length} pitches &middot; side ${list[0].lineup}</span></header>
      <div class="stats" style="margin-bottom:12px">
        <div class="stat"><span class="k">Line</span><span class="v" style="font-size:15px">${s.H}-${s.AB}${s.BB?', '+s.BB+' BB':''}${s.K?', '+s.K+' K':''}</span></div>
        <div class="stat"><span class="k">wOBA</span><span class="v">${avg3(s.wOBA)}</span></div>
        <div class="stat hero"><span class="k">Dec runs/100 ${help('Runs gained or lost per 100 pitches by swing-or-take decisions alone in this game.')}</span><span class="v">${sgn1(s.DecRuns)}</span></div>
        <div class="stat"><span class="k">Chases</span><span class="v">${chases.length}<small>/${list.filter(p=>!p.inZone).length} out of zone</small></span></div>
        <div class="stat"><span class="k">Strikes taken</span><span class="v">${ztakes.length}<small>/${list.filter(p=>p.inZone).length} in zone</small></span></div>
        <div class="stat"><span class="k">Whiffs</span><span class="v">${list.filter(p=>p.decision==='swing_miss').length}</span></div>
      </div>
      <div class="tw"><table><thead><tr><th>PA</th><th>Result</th><th>Sequence</th></tr></thead>
        <tbody>${pas.map((pa,i)=>`<tr><td class="n">${i+1}</td><td><b>${pa.outcome||'--'}</b></td>
          <td><div class="seqlog">${pa.pitches.map(p=>{
            const bad = (!p.inZone && p.decision!=='taken' && p.decision!=='hbp');
            return `<span class="p ${p.decision==='in_play'?'bip':(bad?'sw':'')}" title="${bad?'chase':''}">${p.pitchType} ${decShort(p)}${bad?' *':''}</span>`;
          }).join(' ')}</div></td></tr>`).join('')}</tbody></table></div>
      ${chases.length?`<p class="note" style="margin:9px 0 0">* marks a swing at a pitch outside the zone.</p>`:''}
    </div>`;
  }).join('');

  return `<div class="col">
    <div class="panel"><div class="row">
      <button class="btn ghost sm" data-act="close-report">&larr; All games</button>
      <div><span class="eyebrow">${g.gameType} &middot; ${fmtDate(g.date)}</span>
        <h2 style="margin-top:2px">vs ${esc(g.opponent||'--')}</h2></div>
      <span class="note" style="margin-left:auto">${ps.length} pitches &middot;
        ${derivePAs(ps).filter(p=>p.complete).length} plate appearances &middot; ${sides.length} side${sides.length>1?'s':''}</span>
      ${g.status==='live'?`<button class="btn danger sm" data-act="end-game">End game</button>`:''}
      <button class="btn danger sm" data-act="delete-game" data-id="${g.id}">Delete game</button>
    </div></div>
    ${sendPanel(g)}
    ${lineupCard(g)}
    ${blocks || `<div class="empty">No pitches logged in this game.</div>`}
  </div>`;
}

/* ---------- sending reports to the hitters ----------
   This page cannot send mail itself -- there is no mail server behind it and
   outbound requests are blocked. What it can do is hand a finished report to
   your own mail app, addressed and written, so sending is one click and you
   still see what goes out. */
function sendPanel(g){
  const ids = [...new Set(gamePitches(g.id).map(p=>p.athleteId))];
  if(!ids.length) return '';
  const withMail = ids.filter(id=>athlete(id)?.email);
  const without  = ids.filter(id=>!athlete(id)?.email);
  return `<div class="panel">
    <header><h3>Send reports to hitters</h3>
      <span class="sub">${withMail.length} of ${ids.length} have an email on file</span></header>
    <div class="row">
      <button class="btn primary" data-act="mail-all" data-gid="${g.id}"${withMail.length?'':' disabled'}>
        Open ${withMail.length||''} draft${withMail.length===1?'':'s'}</button>
      <span class="note">Each hitter gets their own at-bat-by-at-bat report. Your mail app opens with it
        written and addressed -- review, then send.</span>
    </div>
    ${without.length?`<div class="warnbar" style="margin-top:12px">
      No email on the roster for ${without.map(id=>esc(aName(id))).join(', ')}.
      Add one on the <b>Roster</b> tab and it will be included next time.</div>`:''}
    <div class="tw" style="margin-top:12px"><table><thead><tr>
      <th>Hitter</th><th>Email</th><th></th></tr></thead>
      <tbody>${ids.map(id=>{
        const a = athlete(id);

<script>
/* ============================================================
   IMPORT -- move a season between deployments
   ------------------------------------------------------------
   Reads the JSON that the Export tab writes and loads it into
   whichever store is active. Two steps on purpose: parse and
   show exactly what will happen, then apply only on confirm.
   Nothing is written during the preview.
   ============================================================ */

const normName = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');

/* Parse and validate. Returns {ok, errors, warnings, athletes, games, pitches}.
   Strict about shape, forgiving about extra fields and about the older nested
   lineup format, so a file exported by any version still loads. */
function parseImport(text){
  const out = {ok:false, errors:[], warnings:[], athletes:[], games:[], pitches:[]};
  let raw;
  try{ raw = JSON.parse(text); }
  catch(e){ out.errors.push('That is not valid JSON. Paste the whole exported file, or choose it with the file picker.'); return out; }

  if(!raw || typeof raw !== 'object' || Array.isArray(raw)){
    out.errors.push('The file should be a single JSON object with athletes, games and pitches.');
    return out;
  }
  for(const k of ['athletes','games','pitches']){
    if(!Array.isArray(raw[k])){ out.errors.push(`Missing or malformed "${k}" list.`); }
  }
  if(out.errors.length) return out;

  out.athletes = raw.athletes.filter(a=>{
    if(!a || !a.id || !a.name){ out.warnings.push('Skipped a hitter with no id or name.'); return false; }
    return true;
  });
  out.games = raw.games.filter(g=>{
    if(!g || !g.id || !g.date){ out.warnings.push('Skipped a game with no id or date.'); return false; }
    lineupEntries(g);                       // migrates the old nested shape in place
    if(!g.gameType) g.gameType = 'game';
    if(!g.lineupMode) g.lineupMode = 'single';
    if(!g.status) g.status = 'final';
    return true;
  });
  const gameIds = new Set(out.games.map(g=>g.id));
  out.pitches = raw.pitches.filter(p=>{
    if(!p || !p.id || !p.gameId || !p.athleteId){ out.warnings.push('Skipped a pitch with missing ids.'); return false; }
    if(!gameIds.has(p.gameId)){ out.warnings.push(`Skipped a pitch from game ${p.gameId}, which is not in the file.`); return false; }
    if(p.zoneRow==null || p.zoneCol==null || !p.decision){ out.warnings.push('Skipped a pitch with no location or result.'); return false; }
    if(p.inZone==null) p.inZone = inZone(p.zoneRow, p.zoneCol);
    return true;
  });

  if(!out.athletes.length && !out.pitches.length){
    out.errors.push('The file has nothing to import.');
    return out;
  }
  out.ok = true;
  out.exportedAt = raw.exportedAt || null;
  return out;
}

/* Work out what an import would do, without doing it. `matchByName` maps an
   incoming hitter onto an existing one with the same name, so importing into a
   roster you have already typed does not create a second Zak Evers. */
function planImport(parsed, opts){
  const byId = new Map(S.athletes.map(a=>[a.id,a]));
  const byName = new Map(S.athletes.map(a=>[normName(a.name),a]));
  const remap = {};                          // incoming athlete id -> existing id
  const plan = {newAthletes:[], mergedAthletes:[], newGames:[], skippedGames:[],
                newPitches:[], skippedPitches:[], remap};

  for(const a of parsed.athletes){
    if(byId.has(a.id)){ plan.mergedAthletes.push(a); continue; }
    const match = opts.matchByName ? byName.get(normName(a.name)) : null;
    if(match){ remap[a.id] = match.id; plan.mergedAthletes.push(a); }
    else plan.newAthletes.push(a);
  }

  const haveGames = new Set(S.games.map(g=>g.id));
  for(const g of parsed.games){
    if(haveGames.has(g.id)) plan.skippedGames.push(g);
    else plan.newGames.push(g);
  }

  const havePitches = new Set(S.pitches.map(p=>p.id));
  const newGameIds = new Set(plan.newGames.map(g=>g.id));
  for(const p of parsed.pitches){
    if(havePitches.has(p.id) || !newGameIds.has(p.gameId)) plan.skippedPitches.push(p);
    else plan.newPitches.push(p);
  }
  return plan;
}

/* Apply the plan. Local state first so the screen is immediately right, then
   the store one row at a time -- a failed write lands in the retry queue like
   any other, so a flaky connection cannot lose half an import. */
async function applyImport(parsed, opts){
  const plan = planImport(parsed, opts);
  const remap = plan.remap;
  const fixId = id => remap[id] || id;

  const rows = {athletes:[], games:[], pitches:[]};
  for(const a of plan.newAthletes){
    rows.athletes.push({...a, active: a.active!==false});
  }
  for(const g of plan.newGames){
    const copy = {...g, lineup: lineupEntries(g).map(e=>({...e, athleteId: e.athleteId ? fixId(e.athleteId) : null}))};
    delete copy.lineups;                     // drop the legacy shape on the way in
    rows.games.push(copy);
  }
  for(const p of plan.newPitches){
    rows.pitches.push({...p, athleteId: fixId(p.athleteId)});
  }

  /* Hold every incoming id before touching local state. Each write triggers a
     snapshot from the store, and a snapshot only preserves local rows that are
     spoken for -- so without this, writing the first row would drop every row
     still waiting its turn. */
  const allIds = [...rows.athletes, ...rows.games, ...rows.pitches].map(r=>r.id);
  allIds.forEach(id=>inflight.add(id));

  let written = 0, failed = 0;
  try{
    S.athletes.push(...rows.athletes);
    S.games.push(...rows.games);
    S.pitches.push(...rows.pitches);
    persistCache();
    adoptLiveGame();
    render();

    for(const coll of ['athletes','games','pitches']){
      for(const row of rows[coll]){
        try{ await write(coll, row.id, row); written++; }
        catch(e){ failed++; }
      }
    }
  }finally{
    allIds.forEach(id=>inflight.delete(id));
  }

  return {
    athletes: plan.newAthletes.length,
    merged: plan.mergedAthletes.length,
    games: plan.newGames.length,
    pitches: plan.newPitches.length,
    skippedGames: plan.skippedGames.length,
    skippedPitches: plan.skippedPitches.length,
    remapped: Object.keys(remap).length,
    written, failed,
  };
}

/* ---------- the panel ---------- */
function importPanel(){
  const imp = S.imp || (S.imp = {text:'', parsed:null, opts:{matchByName:true}, result:null, busy:false});

  if(imp.result){
    const r = imp.result;
    return `<div class="panel">
      <header><h3>Import finished</h3></header>
      <div class="stats" style="margin-bottom:12px">
        <div class="stat"><span class="k">Hitters added</span><span class="v">${r.athletes}</span></div>
        <div class="stat"><span class="k">Games added</span><span class="v">${r.games}</span></div>
        <div class="stat"><span class="k">Pitches added</span><span class="v">${r.pitches}</span></div>
        ${r.merged?`<div class="stat"><span class="k">Hitters matched</span><span class="v">${r.merged}</span></div>`:''}
        ${r.skippedGames?`<div class="stat"><span class="k">Games already here</span><span class="v">${r.skippedGames}</span></div>`:''}
      </div>
      ${r.failed?`<div class="warnbar"><b>${r.failed}</b> row${r.failed===1?'':'s'} could not reach the
        database and are queued. They send automatically when the connection comes back --
        keep this page open until the badge at the top says synced.</div>`
       :`<p class="note" style="margin:0">Everything was saved. Check a hitter's page to confirm
         their heat map looks right.</p>`}
      <div class="row" style="margin-top:14px">
        <button class="btn ghost" data-act="imp-reset">Import another file</button>
        <button class="btn primary" data-act="tab" data-id="hitter">Go to Hitters</button>
      </div>
    </div>`;
  }

  const p = imp.parsed;
  const plan = p && p.ok ? planImport(p, imp.opts) : null;

  return `<div class="panel">
    <header><h3>Import</h3>
      <span class="sub">move a season from another copy of this app</span></header>
    <p class="note" style="margin:0 0 12px;max-width:64ch">Choose a JSON file exported from any
      copy of this tracker, or paste its contents. You will see exactly what is going to be added
      before anything is written.</p>

    <div class="row" style="margin-bottom:10px">
      <input type="file" id="imp-file" accept=".json,application/json" data-act="imp-file">
    </div>
    <label class="field">
      <span>Or paste the file contents</span>
      <textarea id="imp-text" data-act="imp-text" rows="4" placeholder='{"exportedAt": "...", "athletes": [...], "games": [...], "pitches": [...]}'
        style="width:100%;font-family:var(--f-mono);font-size:11.5px;background:var(--navy-900);
        color:var(--slate-100);border:1px solid var(--navy-700);border-radius:4px;padding:9px;resize:vertical"
        >${esc(imp.text)}</textarea>
    </label>

    <div class="row" style="margin-top:12px">
      <button class="btn" data-act="imp-check"${imp.text.trim()?'':' disabled'}>Check the file</button>
      ${imp.text.trim()?`<button class="btn ghost sm" data-act="imp-reset">Clear</button>`:''}
    </div>

    ${p && p.errors.length?`<div class="warnbar" style="margin-top:12px">
      ${p.errors.map(e=>esc(e)).join('<br>')}</div>`:''}

    ${plan?`
      <div style="margin-top:16px;border-top:1px solid var(--navy-700);padding-top:14px">
        <h4 style="margin-bottom:10px">What this will add</h4>
        <div class="stats" style="margin-bottom:12px">
          <div class="stat"><span class="k">New hitters</span><span class="v">${plan.newAthletes.length}</span></div>
          <div class="stat"><span class="k">New games</span><span class="v">${plan.newGames.length}</span></div>
          <div class="stat hero"><span class="k">New pitches</span><span class="v">${plan.newPitches.length}</span></div>
          <div class="stat"><span class="k">Hitters matched ${help('A hitter in the file whose name already exists on your roster. Their games are attached to the hitter you already have instead of creating a duplicate.')}</span><span class="v">${plan.mergedAthletes.length}</span></div>
          <div class="stat"><span class="k">Games skipped ${help('Games whose id is already in this copy. They are left exactly as they are -- an import never overwrites what you already have.')}</span><span class="v">${plan.skippedGames.length}</span></div>
        </div>
        <div class="row" style="margin-bottom:12px">
          <div class="field"><span>Hitters with the same name</span>
            <div class="seg">
              <button data-act="imp-opt" data-k="matchByName" data-v="1" aria-pressed="${imp.opts.matchByName}">Treat as the same person</button>
              <button data-act="imp-opt" data-k="matchByName" data-v="0" aria-pressed="${!imp.opts.matchByName}">Keep separate</button>
            </div>
          </div>
        </div>
        ${p.warnings.length?`<div class="warnbar" style="margin-bottom:12px">
          <b>${p.warnings.length}</b> row${p.warnings.length===1?'':'s'} will be skipped:<br>
          ${p.warnings.slice(0,5).map(x=>esc(x)).join('<br>')}
          ${p.warnings.length>5?`<br>...and ${p.warnings.length-5} more`:''}</div>`:''}
        ${plan.newPitches.length===0?`<div class="warnbar" style="margin-bottom:12px">
          Nothing new to add -- every game in this file is already here.</div>`:''}
        <div class="row">
          <button class="btn primary" data-act="imp-apply"${plan.newPitches.length||plan.newAthletes.length||plan.newGames.length?'':' disabled'}>
            ${imp.busy?'Importing...':'Import '+plan.newPitches.length+' pitches'}</button>
          <span class="note">Existing data is never overwritten. Export first if you want a backup.</span>
        </div>
      </div>`:''}
  </div>`;
}
</script>
<script>
/* ============================================================
   ACTIONS -- every mutation in the app.
   One delegated listener; no per-render handler wiring to leak.
   ============================================================ */

/* ---------- writing a pitch ---------- */
async function commitPitch(decision, extra){
  const g = game(S.liveGameId);
  if(!g){ toast('No live game', true); return; }
  const z = S.pending.zone, pt = S.pending.pt;
  if(!z || !pt){ toast('Pick a zone and a pitch type first', true); return; }

  const L = S.activeLineup;
  const st = liveState(g);
  const cur = st.per[L];
  const slot = cur.batterIdx;
  const athleteId = occupant(g, L, slot);
  if(!athleteId){ toast('That lineup slot is empty -- use Sub to fill it', true); return; }

  const paSeq = cur.open ? cur.open.paSeq : st.nextPA;
  const c = cur.count;
  const pitch = {
    id: g.id+'-'+st.nextSeq,
    gameId: g.id, seq: st.nextSeq, paSeq,
    date: g.date, gameType: g.gameType,
    lineup: L, slot, athleteId,
    balls: c.balls, strikes: c.strikes,
    zoneRow: z.r, zoneCol: z.c, inZone: inZone(z.r, z.c),
    pitchType: pt, pitcherHand: S.hand || 'R',
    decision,
    result: extra?.result ?? null,
    spray: extra?.spray ?? null,
    ev: extra?.ev ?? null,
    la: extra?.la ?? null,
    dist: extra?.dist ?? null,
    createdAt: Date.now(),
  };

  S.pitches.push(pitch);
  S.pending = {zone:null, pt:null};
  closeModal();
  render();
  await write('pitches', pitch.id, pitch);

  // Announce the at-bat ending so the coach knows the order moved on.
  const after = advanceCount(pitch);
  if(decision==='in_play') toast(pitch.result+' -- next hitter');
  else if(decision==='hbp') toast('HBP -- next hitter');
  else if(after.balls>=4) toast('Walk -- next hitter');
  else if(after.strikes>=3) toast('Strikeout -- next hitter');
  render();
}

async function undoPitch(){
  const g = game(S.liveGameId); if(!g) return;
  const ps = gamePitches(g.id).slice().sort((a,b)=>a.seq-b.seq);
  const last = ps[ps.length-1];
  if(!last) return;
  S.pitches = S.pitches.filter(p=>p.id!==last.id);
  S.pending = {zone:null, pt:null};
  render();
  await remove('pitches', last.id);
  toast('Removed pitch '+last.seq);
  render();
}

/* ---------- games ---------- */
async function startGame(){
  const su = S.setup;
  const lineup = [];
  for(const L of (su.lineupMode==='dual' ? ['A','B'] : ['A'])){
    su.lineups[L].forEach((id, slot)=>{
      if(id) lineup.push({lineup:L, slot, athleteId:id, enteredAtPitchSeq:1});
    });
  }
  const g = {
    id: uid(), date: su.date || todayISO(), opponent: su.opponent.trim(),
    gameType: su.gameType, lineupMode: su.lineupMode,
    lineup,
    status: 'live', createdAt: Date.now(),
  };
  S.games.push(g);
  S.liveGameId = g.id;
  S.activeLineup = 'A';
  S.pending = {zone:null, pt:null};
  S.setup = null;
  render();
  await write('games', g.id, g);
  toast('Tracking '+(g.opponent||'game'));
}

async function endGame(){
  const g = game(S.liveGameId) || game(S.reportGameId);
  if(!g) return;
  const open = liveState(g);
  const incomplete = ['A','B'].filter(L=>open.per[L].open).length;
  if(incomplete){
    const go = await askConfirm({
      title:'End the game?',
      body:`There is an at-bat still in progress. Its pitches are already saved, but it
            will show as incomplete and will not count as a plate appearance.`,
      buttons:[{id:'cancel', label:'Keep tracking'},
               {id:'end', label:'End game', cls:'danger'}],
    });
    if(go !== 'end') return;
  }
  g.status = 'final';
  const id = g.id;
  S.liveGameId = null;
  S.tab = 'games';
  S.reportGameId = id;
  render();
  await write('games', id, g);
  toast('Game ended -- report ready');
}

async function saveGameLineups(g){ await write('games', g.id, g); }

/* ---------- substitutions ----------
   One append per change. Never rewrites history, so the pitches a hitter
   already saw stay theirs and the slot's whole sequence survives in the
   report and the export. */
async function subIn(g, L, slot, athleteId){
  const es = lineupEntries(g);
  if(occupantOf(g, L, slot) === athleteId) return;          // nothing to do
  const st = liveState(g);
  es.push({lineup:L, slot, athleteId, enteredAtPitchSeq: st.nextSeq});
  render();
  drawModal();
  await saveGameLineups(g);
  render();
  drawModal();
  toast(athleteId ? aName(athleteId)+' in at '+(slot+1) : 'Slot '+(slot+1)+' cleared');
}

async function deleteGame(gid){
  const g = game(gid);
  if(!g) return;
  const ps = gamePitches(gid);
  const who = (g.opponent ? 'vs ' + g.opponent : 'the ' + g.gameType) + ' on ' + fmtDate(g.date);
  const hitters = new Set(ps.map(p=>p.athleteId)).size;
  const go = await askConfirm({
    title:'Delete this game?',
    body:`<p style="margin:0 0 10px"><b>${esc(who)}</b></p>
      <p style="margin:0 0 10px"><b class="num">${ps.length}</b> pitch${ps.length===1?'':'es'} and
        <b class="num">${derivePAs(ps).filter(p=>p.complete).length}</b> plate appearances will be
        removed from <b class="num">${hitters}</b> hitter${hitters===1?'':'s'}' profiles.</p>
      <p style="margin:0" class="note">This cannot be undone. Export from the Export tab first
        if you want a copy.</p>`,
    buttons:[{id:'cancel', label:'Cancel'},
             {id:'delete', label:'Delete game', cls:'danger'}],
  });
  if(go !== 'delete') return;

  S.pitches = S.pitches.filter(p=>p.gameId!==gid);
  S.games   = S.games.filter(x=>x.id!==gid);
  if(S.liveGameId===gid) S.liveGameId = null;
  if(S.reportGameId===gid) S.reportGameId = null;
  render();
  // Tombstoned first so no in-flight snapshot can put any of them back, then
  // removed together rather than one blocking round trip at a time.
  await Promise.all(ps.map(p=>remove('pitches', p.id)));
  await remove('games', gid);
  S.pitches = S.pitches.filter(p=>p.gameId!==gid);
  S.games   = S.games.filter(x=>x.id!==gid);
  persistCache();
  toast('Deleted ' + who);
  render();
}

/* ---------- deleting a hitter ----------
   A hitter who has seen pitches is a decision, not a click: benching keeps
   every number and only hides them from new lineups, which is what a coach
   usually wants. Deleting is offered plainly, with the cost stated. */
async function deleteAthlete(id){
  const a = athlete(id);
  if(!a) return;
  const theirs = S.pitches.filter(p=>p.athleteId===id);
  const pas = derivePAs(S.pitches).filter(pa=>pa.complete && pa.athleteId===id).length;
  const inLineups = S.games.filter(g=>lineupEntries(g).some(e=>e.athleteId===id));

  const buttons = [{id:'cancel', label:'Cancel'}];
  let body;
  if(!theirs.length){
    body = `<p style="margin:0 0 10px">Remove <b>${esc(a.name)}</b> from the roster?</p>
      <p style="margin:0" class="note">They have no pitches logged, so nothing else is affected.</p>`;
    buttons.push({id:'delete', label:'Remove hitter', cls:'danger'});
  }else{
    body = `<p style="margin:0 0 10px"><b>${esc(a.name)}</b> has
        <b class="num">${theirs.length}</b> pitch${theirs.length===1?'':'es'} and
        <b class="num">${pas}</b> plate appearance${pas===1?'':'s'} logged across
        <b class="num">${new Set(theirs.map(p=>p.gameId)).size}</b> game${new Set(theirs.map(p=>p.gameId)).size===1?'':'s'}.</p>
      <p style="margin:0 0 10px"><b>Bench</b> keeps all of it and only hides them from new lineups.
        That is almost always what you want for a player who has left the program.</p>
      <p style="margin:0" class="note">Deleting also destroys those pitches. Team and game
        numbers will change. This cannot be undone.</p>`;
    buttons.push({id:'bench', label:a.active===false?'Keep benched':'Bench instead'});
    buttons.push({id:'delete', label:'Delete everything', cls:'danger'});
  }

  const go = await askConfirm({title:'Delete hitter?', body, buttons});
  if(go === 'bench'){
    a.active = false;
    render();
    await write('athletes', a.id, a);
    toast(a.name+' benched -- data kept');
    return;
  }
  if(go !== 'delete') return;

  // Drop their lineup entries so reports never show a hitter who is gone.
  for(const g of inLineups){
    g.lineup = lineupEntries(g).filter(e=>e.athleteId!==id);
  }
  S.pitches = S.pitches.filter(p=>p.athleteId!==id);
  S.athletes = S.athletes.filter(x=>x.id!==id);
  if(S.athleteId===id) S.athleteId = null;
  render();
  await Promise.all(theirs.map(p=>remove('pitches', p.id)));
  await Promise.all(inLineups.map(g=>write('games', g.id, g)));
  await remove('athletes', id);
  S.pitches = S.pitches.filter(p=>p.athleteId!==id);
  S.athletes = S.athletes.filter(x=>x.id!==id);
  persistCache();
  toast(a.name+' deleted');
  render();
}

/* ---------- per-hitter report text ----------
   Plain text on purpose: it has to survive every mail client, and a coach
   should be able to read it on a phone without pinching. */
function reportText(gid, athleteId){
  const g = game(gid);
  const list = gamePitches(gid).filter(p=>p.athleteId===athleteId).sort((a,b)=>a.seq-b.seq);
  const s = withOPS(computeStats(list, athleteId));
  const pas = derivePAs(list).filter(pa=>pa.athleteId===athleteId);
  const oz = list.filter(p=>!p.inZone);
  const chases = oz.filter(p=>p.decision!=='taken' && p.decision!=='hbp');
  const iz = list.filter(p=>p.inZone);
  const ztakes = iz.filter(p=>p.decision==='taken');
  const L = [];

  L.push(`${aName(athleteId).toUpperCase()} -- ${g.gameType==='scrimmage'?'SCRIMMAGE':'GAME'} REPORT`);
  L.push(`${fmtDate(g.date)}${g.opponent?' vs '+g.opponent:''}`);
  L.push('');
  L.push(`LINE     ${s.H}-${s.AB}${s.BB?', '+s.BB+' BB':''}${s.K?', '+s.K+' K':''}${s.HBP?', '+s.HBP+' HBP':''}`);
  L.push(`PA ${s.PA}   AVG ${avg3(s.AVG)}   OBP ${avg3(s.OBP)}   SLG ${avg3(s.SLG)}   wOBA ${avg3(s.wOBA)}`);
  if(s.xwOBA!=null) L.push(`xwOBA ${avg3(s.xwOBA)} (${s.bipTag} of ${s.bipTot} balls in play measured)`);
  L.push('');
  L.push('SWING DECISIONS');
  L.push(`  Pitches seen        ${s.pitches}`);
  L.push(`  In the zone         ${iz.length}   swung at ${iz.length-ztakes.length}, took ${ztakes.length}`);
  L.push(`  Out of the zone     ${oz.length}   chased ${chases.length}`);
  L.push(`  Chase rate          ${pct(s.Chase,0)}   (lower is better)`);
  L.push(`  Swings at strikes   ${pct(s.ZSwing,0)}   (higher is better)`);
  L.push(`  Whiff rate          ${pct(s.Whiff,0)}   of swings`);
  L.push(`  Decision runs/100   ${sgn1(s.DecRuns)}`);
  L.push('    Runs you gained or lost per 100 pitches by the swing-or-take call alone.');
  L.push('    Taking a ball gains, taking a strike or chasing loses. Above zero is good.');
  L.push('');
  L.push('AT-BATS');
  pas.forEach((pa,i)=>{
    L.push(`  ${i+1}. ${pa.outcome||'in progress'}`);
    pa.pitches.forEach((p,j)=>{
      const a = advanceCount(p);
      const z9 = zone9(p.zoneRow, p.zoneCol);
      const where = z9 ? 'zone '+z9 : 'out of zone';
      const bad = (!p.inZone && p.decision!=='taken' && p.decision!=='hbp') ? '   <- chase' : '';
      const meas = p.ev!=null ? `   ${n1(p.ev)} mph${p.dist!=null?', '+p.dist+' ft':''}` : '';
      L.push(`     ${p.balls}-${p.strikes}  ${PT_NAME[p.pitchType]||p.pitchType}, ${where}`
        + `  -> ${decShort(p)}  (${a.balls}-${a.strikes})${meas}${bad}`);
    });
  });
  const bipEV = list.filter(p=>p.decision==='in_play' && p.ev!=null);
  if(bipEV.length){
    L.push('');
    L.push('CONTACT');
    bipEV.forEach(p=>L.push(`  ${p.result}  ${n1(p.ev)} mph`
      + `${p.la!=null?', '+n1(p.la)+' deg':''}${p.dist!=null?', '+p.dist+' ft':''}`
      + `${xwobaFor(p.ev,p.la)!=null?'   expected value '+avg3(xwobaFor(p.ev,p.la)):''}`));
  }
  L.push('');
  L.push('Mount Marty Baseball -- Hitter Tracker');
  return L.join('\n');
}

function mailtoFor(gid, athleteId){
  const g = game(gid), a = athlete(athleteId);
  const subj = `${g.gameType==='scrimmage'?'Scrimmage':'Game'} report -- ${fmtDate(g.date)}`
    + (g.opponent?` vs ${g.opponent}`:'');
  return `mailto:${encodeURIComponent(a.email||'')}`
    + `?subject=${encodeURIComponent(subj)}`
    + `&body=${encodeURIComponent(reportText(gid, athleteId))}`;
}

/* ---------- export ---------- */
const CSV_COLS = ['pitchId','gameId','date','gameType','opponent','lineup','slot','athleteId','athleteName',
  'bats','paSeq','pitchSeq','balls','strikes','zoneRow','zoneCol','zone9','inZone','pitchType','pitcherHand',
  'decision','result','sprayX','sprayY','exitVelo','launchAngle','distance','xwOBAcontact','decisionRunValue'];

function buildCSV(){
  const lines = [CSV_COLS.join(',')];
  const q = v => {
    if(v==null) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  for(const p of S.pitches.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.seq-b.seq)){
    const a = athlete(p.athleteId), g = game(p.gameId);
    const x = p.decision==='in_play' ? xwobaFor(p.ev, p.la) : null;
    lines.push([p.id, p.gameId, p.date, p.gameType, g?.opponent||'', p.lineup, p.slot+1, p.athleteId,
      a?.name||'', a?.bats||'', p.paSeq, p.seq, p.balls, p.strikes, p.zoneRow, p.zoneCol,
      zone9(p.zoneRow, p.zoneCol) ?? '', p.inZone?1:0, p.pitchType, p.pitcherHand, p.decision, p.result||'',
      p.spray?p.spray.x.toFixed(4):'', p.spray?p.spray.y.toFixed(4):'',
      p.ev??'', p.la??'', p.dist??'', x==null?'':x.toFixed(3), (pitchRV(p)??'')].map(q).join(','));
  }
  return lines.join('\n');
}

function buildJSON(){
  return JSON.stringify({
    exportedAt: new Date().toISOString(),
    schemaVersion: 1,
    lookupSource: LOOKUPS.source,
    athletes: S.athletes, games: S.games, pitches: S.pitches,
  }, null, 1);
}

async function download(filename, text, mime){
  let dl = null;
  try{ dl = (typeof claude!=='undefined' && claude.use) ? await claude.use('downloads') : null; }
  catch(e){ dl = null; }
  if(dl){
    try{
      await dl.save({filename, data:text});
      toast('Saved '+filename);
      return;
    }catch(e){
      if(e && e.code==='cancelled') return;
      toast('Download declined or unavailable', true);
      return;
    }
  }
  // Outside claude.ai, a plain anchor works.
  const url = URL.createObjectURL(new Blob([text], {type:mime}));
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Saved '+filename);
}

/* ---------- field click -> normalized coords ---------- */
function fieldPoint(svg, ev){
  const r = svg.getBoundingClientRect();
  const px = (ev.clientX - r.left) / r.width  * F.W;
  const py = (ev.clientY - r.top)  / r.height * F.H;
  return {
    x: (px - F.cx) / (400*F.ppf),
    y: (F.cy - py) / (400*F.ppf),
  };
}

/* ============================================================
   DELEGATED EVENTS
   ============================================================ */
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const d = el.dataset;

  switch(act){
    case 'tab': S.tab = d.id; S.reportGameId = null; render(); break;

    /* ----- hosted deployment: connect and sign in ----- */
    case 'sb-save': {
      const url = ($('#sb-url')?.value || '').trim();
      const key = ($('#sb-key')?.value || '').trim();
      if(!/^https:\/\/.+/.test(url)){ S.gateError = 'The project URL should start with https://'; render(); break; }
      // Supabase ships two generations of key names: the classic "anon public"
      // JWT (eyJ...) and the newer "publishable" key (sb_publishable_...).
      // Both are safe in a page and both work here. The secret one is neither.
      if(/^sb_secret_/.test(key) || /service_role/.test(key)){
        S.gateError = 'That is the secret / service_role key -- it bypasses every access rule. Use the anon public (or publishable) key instead.';
        render(); break;
      }
      if(key.length < 30){ S.gateError = 'That key looks too short -- copy the whole thing.'; render(); break; }
      try{ localStorage.setItem(SB_KEY, JSON.stringify({url, anonKey:key})); }
      catch(err){ S.gateError = 'This browser is blocking storage, so the connection cannot be saved.'; render(); break; }
      S.gateError = null;
      /* A sign-in link opened on this device before setup leaves a banked
         session. Use it rather than making them ask for a second email. */
      if(sbSession()){
        try{
          if(await supabaseStore.init()){
            store = supabaseStore;
            S.gate = null;
            await adoptRemote();
            toast('Connected -- you were already signed in');
            break;
          }
          S.gateError = supabaseStore.why();
          if(supabaseStore.reason === 'bad-token'){ try{ localStorage.removeItem(SB_SESSION); }catch(err){} }
        }catch(err){
          S.gateError = 'Saved, but could not reach that project. Check the URL and key.';
        }
      }
      S.gate = 'signin';
      render();
      break;
    }
    case 'sb-skip':
      if(BAKED_CONFIG.url) break;
      S.gate = null; S.gateError = null;
      toast('Working on this device only -- nothing will sync');
      render();
      break;
    case 'si-mode':
      S.signin = {email: ($('#si-email')?.value || S.signin?.email || '').trim(), mode: d.v};
      S.gateError = null;
      render();
      break;
    case 'si-pass-go': {
      const cfg = sbConfig();
      const email = ($('#si-email')?.value || '').trim();
      const pass  = $('#si-pass')?.value || '';
      if(!/^[^s@]+@[^s@]+.[^s@]+$/.test(email)){ S.gateError = 'Enter a valid email address.'; render(); break; }
      if(pass.length < 8){ S.gateError = 'Use a password of at least 8 characters.'; render(); break; }
      el.disabled = true;
      el.textContent = d.mode==='signup' ? 'Creating...' : 'Signing in...';
      try{
        const session = await sbPassword(cfg.url, cfg.anonKey, email, pass, d.mode);
        localStorage.setItem(SB_SESSION, JSON.stringify(session));
        S.gateError = null;
        if(await supabaseStore.init()){
          store = supabaseStore;
          S.signin = null;
          S.gate = null;
          await adoptRemote();
          toast('Signed in');
        }else{
          S.gateError = supabaseStore.why();
          // Only a genuinely rejected token is worth throwing away. A missing
          // allowlist row is fixed in Supabase, and the session stays valid.
          if(supabaseStore.reason === 'bad-token'){ try{ localStorage.removeItem(SB_SESSION); }catch(e){} }
        }
      }catch(err){ S.gateError = String(err.message); }
      render();
      break;
    }
    case 'si-back': S.signin = {email:S.signin?.email||'', sent:false}; S.gateError = null; render(); break;
    case 'sign-out':
      try{ localStorage.removeItem(SB_SESSION); }catch(err){}
      S.gate = 'signin'; S.signin = null; S.gateError = null;
      render();
      break;

    /* ----- game setup ----- */
    case 'setup-field':
      if(d.v!=null && el.tagName==='BUTTON'){ S.setup[d.k] = d.v; render(); }
      break;
    case 'setup-move': {
      const i = +d.i, dir = +d.d, L = d.l, arr = S.setup.lineups[L];
      const j = i + dir;
      if(j<0 || j>=arr.length) break;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      render();
      break;
    }
    case 'start-game': await startGame(); break;

    /* ----- tracking ----- */
    case 'pick-zone':
      S.pending.zone = {r:+d.r, c:+d.c};
      render();
      break;
    case 'pick-pt':
      S.pending.pt = d.v;
      render();
      break;
    case 'set-hand': S.hand = d.v; render(); break;
    case 'pick-dec':
      if(d.v==='in_play'){ S.bip = {result:'', x:null, y:null, ev:'', la:'', dist:''}; openModal('bip'); }
      else await commitPitch(d.v, null);
      break;
    case 'set-lineup': S.activeLineup = d.l; S.pending={zone:null,pt:null}; render(); break;
    case 'undo': await undoPitch(); break;
    case 'end-game': await endGame(); break;
    case 'sub-open': S.subSide = S.activeLineup; openModal('sub'); break;
    case 'sub-side': S.subSide = d.l; drawModal(); break;
    case 'sub-add-new': {
      const g = game(S.liveGameId);
      if(!g){ toast('No live game', true); break; }
      const name = ($('#sub-new-name')?.value || '').trim();
      if(!name){ toast('Give the hitter a name', true); break; }
      const slot = +($('#sub-new-slot')?.value || 0);
      const a = {
        id: uid(), name,
        number: ($('#sub-new-num')?.value || '').trim(),
        bats: $('#sub-new-bats')?.value || 'R',
        classYear:'', positions:'', email:'', active:true, createdAt: Date.now(),
      };
      S.athletes.push(a);
      await write('athletes', a.id, a);
      await subIn(g, d.l || S.activeLineup, slot, a.id);
      break;
    }

    /* ----- ball in play ----- */
    case 'bip-res': S.bip.result = d.v; drawModal(); break;
    case 'bip-save': {
      const b = S.bip;
      const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
      await commitPitch('in_play', {
        result: b.result,
        spray: b.x!=null ? {x:+b.x.toFixed(4), y:+b.y.toFixed(4)} : null,
        ev: num(b.ev), la: num(b.la), dist: num(b.dist),
      });
      break;
    }
    case 'field-click': {
      const svg = el.closest('svg') || el;
      if(!S.bip) break;
      const p = fieldPoint(svg, e);
      S.bip.x = p.x; S.bip.y = p.y;
      drawModal();
      break;
    }
    case 'modal-close': dismissModal(); render(); break;
    case 'modal-backdrop': if(e.target===el){ dismissModal(); render(); } break;

    /* ----- filters / pages ----- */
    case 'filter': S.filters[d.k] = d.v; render(); break;
    case 'filter-reset':
      S.filters = {gameType:'game', count:'all', pt:'all', hand:'all', from:'', to:'', gameId:''};
      render(); break;
    case 'hm': S.hmMetric = d.v; render(); break;
    case 'team-sort': S.teamSort = d.k; render(); break;
    case 'goto-hitter': S.athleteId = d.id; S.tab = 'hitter'; render(); break;
    case 'open-report': S.reportGameId = d.id; S.tab = 'games'; render(); break;
    case 'close-report': S.reportGameId = null; render(); break;

    /* ----- roster ----- */
    case 'add-athlete': await addAthlete(); break;
    case 'delete-game': await deleteGame(d.id); break;
    case 'delete-athlete': await deleteAthlete(d.id); break;
    case 'confirm-pick': resolveConfirm(d.v==='cancel' ? false : d.v); break;

    /* ----- report delivery ----- */
    case 'mail-one': {
      window.location.href = mailtoFor(d.gid, d.id);
      break;
    }
    case 'mail-all': {
      const g = game(d.gid);
      const ids = [...new Set(gamePitches(d.gid).map(p=>p.athleteId))]
        .filter(id=>athlete(id)?.email);
      if(!ids.length){ toast('No hitters in this game have an email on the roster', true); return; }
      // One window per hitter: the body is different for each, so there is no
      // single message that can carry all nine.
      ids.forEach((id,i)=> setTimeout(()=>window.open(mailtoFor(d.gid,id),'_blank'), i*450));
      toast('Opening '+ids.length+' draft'+(ids.length>1?'s':''));
      break;
    }
    case 'copy-report': {
      const txt = reportText(d.gid, d.id);
      try{
        await navigator.clipboard.writeText(txt);
        toast('Report copied');
      }catch(err){
        S.showReport = {gid:d.gid, id:d.id};
        openModal('report');
      }
      break;
    }
    case 'show-report': S.showReport = {gid:d.gid, id:d.id}; openModal('report'); break;
    case 'toggle-active': {
      const a = athlete(d.id);
      a.active = a.active===false;
      render();
      await write('athletes', a.id, a);
      break;
    }

    /* ----- export ----- */
    /* ----- import ----- */
    case 'imp-check':
      S.imp.parsed = parseImport(S.imp.text);
      render();
      break;
    case 'imp-opt':
      S.imp.opts[d.k] = d.v === '1';
      render();
      break;
    case 'imp-reset':
      S.imp = {text:'', parsed:null, opts:{matchByName:true}, result:null, busy:false};
      render();
      break;
    case 'imp-apply': {
      const imp = S.imp;
      if(!imp.parsed || !imp.parsed.ok || imp.busy) break;
      imp.busy = true;
      render();
      imp.result = await applyImport(imp.parsed, imp.opts);
      imp.busy = false;
      render();
      toast('Imported '+imp.result.pitches+' pitches');
      break;
    }

    case 'export-csv':
      await download('mmb-pitches-'+todayISO()+'.csv', buildCSV(), 'text/csv');
      break;
    case 'export-json':
      await download('mmb-tracker-'+todayISO()+'.json', buildJSON(), 'application/json');
      break;
  }
});

/* change events: selects and number inputs */
document.addEventListener('change', async e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const d = el.dataset;
  switch(d.act){
    case 'setup-slot': S.setup.lineups[d.l][+d.i] = el.value; render(); break;
    case 'setup-field': S.setup[d.k] = el.value; break;
    case 'pick-athlete': S.athleteId = el.value; render(); break;
    case 'athlete-email': {
      const a = athlete(d.id); if(!a) break;
      const v = el.value.trim();
      if(v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){
        toast('That does not look like an email address', true);
        el.value = a.email || '';
        break;
      }
      a.email = v;
      await write('athletes', a.id, a);
      toast(v ? 'Email saved for '+a.name : 'Email cleared');
      break;
    }
    case 'filter-sel': S.filters[d.k] = el.value; render(); break;
    case 'filter-inp': S.filters[d.k] = el.value; render(); break;
    case 'imp-file': {
      const file = el.files && el.files[0];
      if(!file) break;
      try{
        S.imp.text = await file.text();
        S.imp.parsed = parseImport(S.imp.text);
      }catch(err){
        S.imp.parsed = {ok:false, errors:['Could not read that file: '+err.message], warnings:[]};
      }
      render();
      break;
    }
    case 'sub-pick': {
      const g = game(S.liveGameId);
      if(!g){ toast('No live game to substitute in', true); break; }
      const L = d.l || S.subSide || S.activeLineup, i = +d.i;
      await subIn(g, L, i, el.value || null);
      break;
    }
  }
});

/* live-typing fields that must not force a re-render mid-keystroke */
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const d = el.dataset;
  if(d.act==='setup-field'){ S.setup[d.k] = el.value; return; }
  if(d.act==='imp-text'){
    S.imp.text = el.value;
    // Enable the Check button without re-rendering the textarea under the caret.
    const btn = document.querySelector('#view button[data-act="imp-check"]');
    if(btn) btn.disabled = !el.value.trim();
    return;
  }
  if(d.act==='bip-num' && S.bip){
    S.bip[d.k] = el.value;
    // Refresh only the expected-wOBA readout, so focus and caret survive.
    if(d.k==='ev' || d.k==='la'){
      const ev = parseFloat(S.bip.ev), la = parseFloat(S.bip.la);
      const x = isFinite(ev) ? xwobaFor(ev, isFinite(la)?la:null) : null;
      const out = document.querySelector('#bip-xw');
      if(out) out.textContent = x==null ? '--' : x.toFixed(3).replace(/^0/,'');
    }
  }
});

/* keyboard shortcuts for the tracking screen -- a coach keeping up with a game */
document.addEventListener('keydown', e=>{
  if(S.tab!=='live' || !S.liveGameId || S.modal) return;
  if(e.target.matches('input,select,textarea')) return;
  const k = e.key.toLowerCase();
  const map = {b:'taken', w:'swing_miss', f:'foul', h:'hbp'};
  if(k==='z'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); undoPitch(); return; }
  if(map[k] && S.pending.zone && S.pending.pt){ e.preventDefault(); commitPitch(map[k], null); }
  if(k==='i' && S.pending.zone && S.pending.pt){
    e.preventDefault();
    S.bip = {result:'', x:null, y:null, ev:'', la:'', dist:''};
    openModal('bip');
  }
});

boot();
</script>
