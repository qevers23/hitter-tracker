<title>Mount Marty Hitter Tracker</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============================================================
   Mount Marty Baseball -- Hitter Zone Tracker
   Single committed dark theme. Palette sampled from the team logo.
   ============================================================ */
:root{
  --navy-900:#0F1E3D; --navy-850:#132B52; --navy-800:#16274C; --navy-750:#1B2F58;
  --navy-700:#22355F; --navy-600:#2E4275;
  --gold-500:#F9A81A; --gold-300:#FBC55E; --gold-700:#C8850E;
  --white:#FFFFFF; --slate-100:#E6EAF2; --slate-300:#A8B3C7; --slate-500:#6E7C99;
  --good:#4FBF8B; --warn:#F9A81A; --bad:#E0614B;
  --r:4px; --r-lg:8px;
  --f-disp:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--navy-900);color:var(--slate-100);
  font-family:var(--f-body);font-size:14px;line-height:1.45;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-300)}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-500)}
.eyebrow{font-family:var(--f-disp);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--slate-500)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mut{color:var(--slate-500)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit}
input,select{font:inherit;color:var(--white);background:var(--navy-900);border:1px solid var(--navy-700);border-radius:var(--r);padding:7px 9px}
input:focus-visible,select:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-500);outline-offset:2px}
a{color:var(--gold-300)}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding-block:14px;border-bottom:1px solid var(--navy-700);margin-bottom:20px;
}
.logo{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.logo svg{display:block}
.logo .wm{font-family:var(--f-disp);font-weight:800;line-height:1;text-transform:uppercase}
.logo .wm b{display:block;font-size:17px;letter-spacing:.02em;color:var(--white)}
.logo .wm i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.22em;color:var(--gold-500);font-weight:700}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{
  font-family:var(--f-disp);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;
  padding:8px 13px;border-radius:var(--r);color:var(--slate-300);
}
nav.tabs button:hover{color:var(--white);background:var(--navy-800)}
nav.tabs button[aria-current="page"]{background:var(--gold-500);color:var(--navy-900)}
#sync{font-size:11px;font-family:var(--f-mono);color:var(--slate-500);white-space:nowrap}
#sync.on{color:var(--good)} #sync.off{color:var(--warn)} #sync.err{color:var(--bad)}

/* ---------- primitives ---------- */
.panel{background:var(--navy-800);border:1px solid var(--navy-700);border-radius:var(--r-lg);padding:16px}
.panel>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel>header .sub{font-size:12px;color:var(--slate-500);margin-left:auto;font-family:var(--f-mono)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.col{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.btn{
  font-family:var(--f-disp);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;
  padding:9px 16px;border-radius:var(--r);background:var(--navy-700);color:var(--white);
  border:1px solid var(--navy-600);transition:background .12s;text-align:center;
}
.btn:hover{background:var(--navy-600)}
.btn.primary{background:var(--gold-500);color:var(--navy-900);border-color:var(--gold-500)}
.btn.primary:hover{background:var(--gold-300)}
.btn.ghost{background:none;border-color:var(--navy-600);color:var(--slate-300)}
.btn.ghost:hover{color:var(--white);border-color:var(--slate-500)}
.btn.danger{background:none;border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:var(--navy-900)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:11.5px}
.seg{display:inline-flex;border:1px solid var(--navy-600);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{
  font-family:var(--f-disp);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;
  padding:7px 12px;color:var(--slate-300);
}
.seg button+button{border-left:1px solid var(--navy-600)}
.seg button:hover{background:var(--navy-700);color:var(--white)}
.seg button[aria-pressed="true"]{background:var(--gold-500);color:var(--navy-900)}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--slate-500);font-weight:600}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:99px;background:var(--navy-700);color:var(--slate-300)}
.pill.gold{background:var(--gold-500);color:var(--navy-900);font-weight:600}
.pill.type-scrimmage{background:var(--navy-600);color:var(--gold-300)}
.pill.live{background:var(--good);color:var(--navy-900);font-weight:600}
.empty{padding:28px 18px;text-align:center;color:var(--slate-500);font-size:13px;border:1px dashed var(--navy-700);border-radius:var(--r-lg)}
.warnbar{background:var(--navy-750);border-left:3px solid var(--gold-500);padding:9px 12px;border-radius:var(--r);font-size:12.5px;color:var(--slate-100)}
.note{font-size:12px;color:var(--slate-500);line-height:1.55}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--navy-700);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{
  font-family:var(--f-disp);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--slate-500);border-bottom-color:var(--navy-600);
}
th[data-sort]{cursor:pointer} th[data-sort]:hover{color:var(--gold-300)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--navy-750)}
tbody tr.clickable{cursor:pointer}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;background:var(--navy-700);border-radius:var(--r);overflow:hidden}
.stat{background:var(--navy-800);padding:10px 12px}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--slate-500);font-weight:600;display:flex;align-items:center;gap:4px}
.stat .v{font-family:var(--f-mono);font-size:19px;font-weight:600;color:var(--white);font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:11px;color:var(--slate-500);font-weight:500}
.stat.hero{background:var(--navy-750)}
.stat.hero .v{color:var(--gold-500);font-size:23px}

/* ---------- help / explainers ---------- */
.hq{
  display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;flex:0 0 13px;
  border:1px solid var(--slate-500);border-radius:99px;font-size:9px;font-weight:700;color:var(--slate-500);
  cursor:help;position:relative;font-family:var(--f-body);line-height:1;
}
.hq:hover{border-color:var(--gold-500);color:var(--gold-500)}
.hq::after{
  content:attr(data-tip);position:absolute;bottom:135%;left:50%;transform:translateX(-50%);
  width:min(274px,72vw);background:var(--navy-700);color:var(--slate-100);border:1px solid var(--navy-600);
  border-radius:var(--r);padding:9px 11px;font-size:12px;font-weight:400;line-height:1.5;
  text-transform:none;letter-spacing:0;z-index:60;pointer-events:none;text-align:left;
  opacity:0;visibility:hidden;
}
.hq:hover::after,.hq:focus-visible::after{opacity:1;visibility:visible}

/* ---------- zone grid ---------- */
.zonewrap{position:relative;display:inline-block;padding:10px;background:var(--navy-900);border-radius:var(--r-lg);border:1px solid var(--navy-700)}
.zone{display:grid;grid-template-columns:repeat(13,1fr);gap:1px;width:min(430px,74vw);aspect-ratio:1}
.zone button{background:var(--navy-800);border-radius:1px;transition:background .08s}
.zone button.iz{background:var(--navy-750)}
.zone button:hover{background:var(--gold-500)}
.zone button.sel{background:var(--gold-500);box-shadow:0 0 0 2px var(--white)}
.szbox{position:absolute;border:2px solid var(--slate-300);pointer-events:none;border-radius:2px}
/* The classic 9-box zone, drawn over the fine grid. Its lines sit on real cell
   boundaries (2/7 and 5/7 of the zone), so the overlay and the derived zone
   number for each pitch always agree. */
.szbox>i,.szbox>b{position:absolute;background:var(--slate-300);opacity:.55}
.szbox>i{top:0;bottom:0;width:1px}
.szbox>b{left:0;right:0;height:1px}
.szbox>i:nth-of-type(1){left:28.571%} .szbox>i:nth-of-type(2){left:71.428%}
.szbox>b:nth-of-type(1){top:28.571%}  .szbox>b:nth-of-type(2){top:71.428%}
.z9num{position:absolute;font-family:var(--f-mono);font-size:9px;color:var(--slate-500);opacity:.5;pointer-events:none}
.hmwrap{position:relative;width:100%;max-width:430px}
.hm{display:grid;grid-template-columns:repeat(13,1fr);gap:0;width:100%;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--navy-900)}
.hm div{position:relative}
.hmlegend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--slate-500);font-family:var(--f-mono);margin-top:9px}
.hmlegend .bar{height:9px;flex:1;border-radius:2px;min-width:70px}
.hatch{background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(168,179,199,.22) 3px 4px)}

/* ---------- tracking ---------- */
.trackbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--navy-800);border:1px solid var(--navy-700);border-radius:var(--r-lg);padding:12px 16px}
.batter{display:flex;align-items:center;gap:11px;min-width:0}
.batter .slot{font-family:var(--f-disp);font-weight:800;font-size:22px;color:var(--gold-500);line-height:1}
.batter .nm{font-family:var(--f-disp);font-weight:700;font-size:17px;color:var(--white);text-transform:uppercase;letter-spacing:.02em}
.batter .meta{font-size:11px;color:var(--slate-500);font-family:var(--f-mono)}
.count{font-family:var(--f-mono);font-size:30px;font-weight:600;color:var(--white);line-height:1;letter-spacing:-.02em}
.count small{font-size:10px;display:block;letter-spacing:.1em;color:var(--slate-500);text-transform:uppercase;font-family:var(--f-disp);font-weight:700}
.steps{display:flex;gap:6px;align-items:center;font-size:11px;font-family:var(--f-disp);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-500)}
.steps .s{padding:3px 8px;border-radius:99px;border:1px solid var(--navy-600)}
.steps .s.done{background:var(--navy-700);color:var(--gold-300)}
.steps .s.now{background:var(--gold-500);color:var(--navy-900);border-color:var(--gold-500)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:7px}
.pgrid button{
  padding:13px 6px;border-radius:var(--r);background:var(--navy-750);border:1px solid var(--navy-700);
  font-family:var(--f-disp);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;text-align:center;
}
.pgrid button:hover{background:var(--navy-600);border-color:var(--slate-500)}
.pgrid button.sel{background:var(--gold-500);color:var(--navy-900);border-color:var(--gold-500)}
.pgrid button small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--slate-500);margin-top:2px}
.pgrid button.sel small{color:var(--navy-800)}
.pgrid button:disabled{opacity:.35;cursor:not-allowed}
.seqlog{display:flex;gap:5px;flex-wrap:wrap}
.seqlog .p{font-family:var(--f-mono);font-size:11px;padding:3px 7px;border-radius:var(--r);background:var(--navy-750);border:1px solid var(--navy-700);color:var(--slate-300)}
.seqlog .p.sw{border-color:var(--gold-700);color:var(--gold-300)}
.seqlog .p.bip{background:var(--gold-500);color:var(--navy-900);border-color:var(--gold-500);font-weight:600}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(6,12,26,.84);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:100;overflow:auto}
.modal{background:var(--navy-800);border:1px solid var(--navy-600);border-radius:var(--r-lg);padding:20px;width:100%;max-width:780px;margin:auto}
.modal>header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.modal>header h2{margin-right:auto}

/* ---------- field ---------- */
.fieldwrap{width:100%;max-width:440px}
.fieldwrap svg{display:block;width:100%;height:auto;cursor:crosshair;border-radius:var(--r-lg);background:var(--navy-900);border:1px solid var(--navy-700)}

/* ---------- lineup builder ---------- */
.lineup{display:flex;flex-direction:column;gap:6px}
.lu{display:flex;align-items:center;gap:9px}
.lu .s{font-family:var(--f-disp);font-weight:800;font-size:14px;color:var(--gold-500);width:18px;text-align:right;flex:0 0 18px}
.lu select{flex:1;min-width:0}
.lu .mv{display:flex;gap:2px}
.lu .mv button{padding:4px 7px;border:1px solid var(--navy-700);border-radius:var(--r);color:var(--slate-500);font-size:11px;line-height:1}
.lu .mv button:hover{color:var(--gold-500);border-color:var(--gold-700)}

/* ---------- count matrix ---------- */
.cmx{display:grid;grid-template-columns:auto repeat(3,1fr);gap:1px;background:var(--navy-700);border-radius:var(--r);overflow:hidden}
.cmx>div,.cmx>button{background:var(--navy-800);padding:7px 9px;text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--slate-100)}
.cmx>div.h{font-family:var(--f-disp);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-500);background:var(--navy-850)}
.cmx>button:hover{background:var(--navy-600)}
.cmx>button[aria-pressed="true"]{background:var(--gold-500);color:var(--navy-900);font-weight:600}
.cmx .sm{display:block;font-size:9.5px;color:var(--slate-500)}
.cmx>button[aria-pressed="true"] .sm{color:var(--navy-800)}

@media (max-width:760px){
  nav.tabs{width:100%;margin-left:0}
  .count{font-size:24px}
  .zone{width:min(430px,86vw)}
  .trackbar{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ============================================================
   CORE -- constants, storage seam, boot
   ------------------------------------------------------------
   PORTABILITY: every read and write in this app goes through
   `store`. The Claude-artifact `db` implementation is the only
   place `claude.use()` appears. To move this app off the
   artifact, write one new object with the same method names
   (see PORTING.md) and change STORE_IMPL. Nothing else in this
   file or the ones after it knows where data lives.
   ============================================================ */

/* ---------- domain constants ---------- */

const PITCH_TYPES = [
  {code:'FB', label:'FB',  name:'Fastball'},
  {code:'SI', label:'SI',  name:'Sinker / two-seam'},
  {code:'CT', label:'CT',  name:'Cutter'},
  {code:'SL', label:'SL',  name:'Slider'},
  {code:'CB', label:'CB',  name:'Curveball'},
  {code:'CH', label:'CH',  name:'Changeup'},
  {code:'SP', label:'SP',  name:'Splitter'},
];
const PT_NAME = Object.fromEntries(PITCH_TYPES.map(p=>[p.code,p.name]));

// A decision is what the hitter did. Ball/strike is derived from the zone tap.
const DECISIONS = [
  {code:'taken',      label:'Taken',    hint:'no swing'},
  {code:'swing_miss', label:'Whiff',    hint:'swing, miss'},
  {code:'foul',       label:'Foul',     hint:'swing, foul'},
  {code:'in_play',    label:'In Play',  hint:'pick result'},
  {code:'hbp',        label:'HBP',      hint:'hit by pitch'},
];

// Ball-in-play results. `ab` = counts as an at-bat, `bases` = for slugging.
const RESULTS = [
  {code:'1B',  label:'Single',      bases:1, hit:true,  ab:true},
  {code:'2B',  label:'Double',      bases:2, hit:true,  ab:true},
  {code:'3B',  label:'Triple',      bases:3, hit:true,  ab:true},
  {code:'HR',  label:'Home Run',    bases:4, hit:true,  ab:true},
  {code:'OUT', label:'Out',         bases:0, hit:false, ab:true},
  {code:'FC',  label:'Fielders Ch', bases:0, hit:false, ab:true},
  {code:'DP',  label:'Double Play', bases:0, hit:false, ab:true},
  {code:'E',   label:'Reach / Err', bases:0, hit:false, ab:true},
  {code:'SF',  label:'Sac Fly',     bases:0, hit:false, ab:false},
  {code:'SAC', label:'Sac Bunt',    bases:0, hit:false, ab:false},
];
const RES = Object.fromEntries(RESULTS.map(r=>[r.code,r]));

// wOBA linear weights, 2024 MLB season (FanGraphs). Stated in the UI.
const WOBA_W = {uBB:0.696, HBP:0.726, '1B':0.883, '2B':1.244, '3B':1.569, HR:2.004};
const WOBA_SCALE_NOTE = '2024 MLB linear weights';

/* ---------- zone geometry ----------
   13 x 13 grid over the plate region. The inner 7 x 7 (rows and
   cols 3-9) is the rulebook strike zone, so a taken pitch becomes
   a ball or a called strike from the tap alone -- the coach never
   enters a count. Row 0 is the TOP of the zone (high pitches).
   Col 0 is the coach's left looking in from behind the catcher. */
const GRID = 13, IZ_LO = 3, IZ_HI = 9;
const inZone = (r,c)=> r>=IZ_LO && r<=IZ_HI && c>=IZ_LO && c<=IZ_HI;
// Distance in cells outside the zone edge -- 0 is in the zone.
function zoneDist(r,c){
  const dr = r<IZ_LO ? IZ_LO-r : (r>IZ_HI ? r-IZ_HI : 0);
  const dc = c<IZ_LO ? IZ_LO-c : (c>IZ_HI ? c-IZ_HI : 0);
  return Math.max(dr,dc);
}
// Chase zone = the ring just outside the zone (where swings are the real mistake).
const inChase = (r,c)=> zoneDist(r,c)>=1 && zoneDist(r,c)<=2;

/* The familiar 9-box zone, derived from the fine grid rather than stored.
   Bands are 2/3/2 cells, so the boxes are symmetric and the drawn overlay
   lines land exactly on cell boundaries. Numbered 1-9 like a scorebook:
   1 is up and to the coach's left looking in from behind the catcher. */
function zone9band(i){ const k = i - IZ_LO; return k < 2 ? 0 : (k < 5 ? 1 : 2); }
function zone9(r, c){
  if(!inZone(r,c)) return null;
  return zone9band(r)*3 + zone9band(c) + 1;
}
// Marks the nine-box grid lines that a 13x13 overlay needs.
const SZ9 = '<i></i><i></i><b></b><b></b>';

/* ============================================================
   LINEUPS -- a flat, append-only list
   ------------------------------------------------------------
   Every lineup change is one entry: who took which slot, and at
   which pitch. Nothing is ever rewritten, so history survives and
   a substitution cannot corrupt what came before. `athleteId:null`
   is how a slot gets emptied.

   Flat on purpose. The earlier shape nested an array inside an
   array inside the game document, which document stores generally
   refuse and which does not map onto a table. This is one list:
     [{lineup:'A', slot:0, athleteId:'x', enteredAtPitchSeq:1}, ...]
   ============================================================ */

// Reads either shape, so games recorded before the change still open.
function lineupEntries(g){
  if(Array.isArray(g.lineup)) return g.lineup;
  const out = [];
  if(g.lineups){                                  // legacy nested shape
    for(const L of ['A','B']){
      const side = g.lineups[L];
      if(!Array.isArray(side)) continue;
      side.forEach((list, slot)=>{
        (Array.isArray(list)?list:[]).forEach(occ=>{
          out.push({lineup:L, slot, athleteId:occ.athleteId,
                    enteredAtPitchSeq:occ.enteredAtPitchSeq || 1});
        });
      });
    }
  }
  g.lineup = out;
  return out;
}

// Who holds this slot right now: the last entry appended for it.
function occupantOf(g, L, slot){
  const es = lineupEntries(g);
  for(let i=es.length-1; i>=0; i--){
    const e = es[i];
    if(e.lineup===L && e.slot===slot) return e.athleteId || null;
  }
  return null;
}

// Everyone who has held the slot, in order -- for the report and the sub screen.
function slotHistory(g, L, slot){

/* ============================================================
   STORAGE SEAM
   Ten methods. Everything above the seam is plain JS.
   ============================================================ */

const LS_KEY = 'mmb_tracker_cache_v1';
const LS_QUEUE = 'mmb_tracker_queue_v1';

/* --- implementation A: Claude artifact `db` --- */
const dbStore = {
  name:'artifact-db', db:null,
  async init(){
    this.db = await claude.use('db');
    return !!this.db;
  },
  async loadAll(){
    const [a,g,p] = await Promise.all([
      this.db.collection('athletes').get(),
      this.db.collection('games').get(),
      this.db.collection('pitches').get(),
    ]);
    const rows = s => (s.docs||s||[]).map(d=> d.data ? {id:d.id, ...d.data()} : d);
    return {athletes:rows(a), games:rows(g), pitches:rows(p)};
  },
  put(coll,id,data){ return this.db.doc(coll+'/'+id).set(data); },
  del(coll,id){ return this.db.doc(coll+'/'+id).delete(); },
  watch(coll,cb){
    if(!this.db.collection(coll).onSnapshot) return null;
    return this.db.collection(coll).onSnapshot(s=>{
      const rows = (s.docs||[]).map(d=> d.data ? {id:d.id, ...d.data()} : d);
      cb(rows);
    });
  },
};

/* --- implementation B: Supabase (the hosted, shareable deployment) ---
   Same ten methods. Plain fetch against PostgREST plus Supabase Auth --
   no client library, so there is nothing to keep up to date and nothing
   to break. Changes from other devices arrive by polling, which for a
   dugout with two or three tablets is both plenty and far more robust
   than a websocket that has to survive a stadium wifi handover. */
const SB_KEY = 'mmb_backend_v1';
const SB_SESSION = 'mmb_session_v1';
const SB_POLL_MS = 5000;

// Column names are snake_case in Postgres and camelCase in the app.
const SB_TABLES = {
  athletes: {table:'athletes', map:{classYear:'class_year'}},
  games:    {table:'games',    map:{lineupMode:'lineup_mode', gameType:'game_type', createdAt:'created_at'}},
  pitches:  {table:'pitches',  map:{gameId:'game_id', paSeq:'pa_seq', gameType:'game_type',
                                    athleteId:'athlete_id', zoneRow:'zone_row', zoneCol:'zone_col',
                                    inZone:'in_zone', pitchType:'pitch_type', pitcherHand:'pitcher_hand',
                                    createdAt:'created_at'}},
};
const snake = s => s.replace(/[A-Z]/g, c=>'_'+c.toLowerCase());
const camel = s => s.replace(/_([a-z])/g, (_,c)=>c.toUpperCase());
const toRow = obj => Object.fromEntries(Object.entries(obj).map(([k,v])=>[snake(k), v]));
const fromRow = row => Object.fromEntries(Object.entries(row).map(([k,v])=>[camel(k), v]));

   The anon key is designed to be public -- it identifies the project, it does
   not grant access. Access is decided by the `coaches` table and enforced by
   Postgres row-level security, so a stranger holding this key still reads zero
   rows. Never put the service_role / secret key here; that one does bypass it. */
const BAKED_CONFIG = {
  url: 'https://xihwikmvohkyochthfdl.supabase.co',
  anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpaHdpa212b2hreW9jaHRoZmRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwODQzMjIsImV4cCI6MjEwNDY2MDMyMn0.Mv-m8iX2TxTuXizBbqrZCKnJWi4AwK7TtpFoYtexWsE',
};

function sbConfig(){
  if(BAKED_CONFIG.url && BAKED_CONFIG.anonKey) return BAKED_CONFIG;
  try{ return JSON.parse(localStorage.getItem(SB_KEY)) || null; }catch(e){ return null; }
}
function sbSession(){
  try{ return JSON.parse(localStorage.getItem(SB_SESSION)) || null; }catch(e){ return null; }
}

const supabaseStore = {
  name:'supabase', cfg:null, session:null, timers:[],

  async init(){
    this.cfg = sbConfig();
    this.session = sbSession();
    if(!this.cfg || !this.session){ this.reason = 'no-session'; return false; }
    /* Prove BOTH that the token is valid and that this email is on the coaches
       list. A 200 is not enough: row-level security hides rows rather than
       refusing the request, so someone who signed up but was never added comes
       back as a perfectly successful EMPTY result. The row count is the check.

       The two failures need different messages, though -- telling someone they
       are not on a list they ARE on sends them to fix the wrong thing. */
    let r;
    try{ r = await this.req('GET', 'coaches?select=email&limit=1'); }
    catch(e){ this.reason = 'unreachable'; return false; }

    if(r.status === 401 || r.status === 403){ this.reason = 'bad-token'; return false; }
    if(!r.ok){
      this.reason = 'server';
      this.detail = (await r.text().catch(()=>'')).slice(0, 200);
      return false;
    }
    const rows = await r.json().catch(()=>[]);
    if(Array.isArray(rows) && rows.length > 0){ this.reason = null; return true; }
    this.reason = 'not-coach';
    return false;
  },

  // The email this device is actually signed in as, read from the token itself.
  signedInAs(){
    try{
      const t = this.session && this.session.access_token;
      if(!t || !t.includes('.')) return null;
      const c = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      return c.email || null;
    }catch(e){ return null; }
  },

  // A message that names the actual problem rather than guessing at one.
  why(){
    const who = this.signedInAs();
    switch(this.reason){
      case 'not-coach':
        return (who ? 'Signed in as ' + who + ', but that address' : 'That address')
          + ' is not on the coaches list. It has to match exactly -- add it in Supabase, then sign in again.';
      case 'bad-token':
        return 'That sign-in was rejected or has expired. Sign in again.';
      case 'unreachable':
        return 'Could not reach the database. Check your connection and try again.';
      case 'server':
        return 'The database refused the request' + (this.detail ? ': ' + this.detail : '.')
          + ' This usually means the schema has not been run, or a policy is wrong.';
      default:
        return 'Could not sign in.';
    }
  },

  async req(method, path, body){
    const headers = {
      apikey: this.cfg.anonKey,
      Authorization: 'Bearer ' + this.session.access_token,
      'Content-Type': 'application/json',
    };
    // Upserts key on the primary key; reads must not ask for a minimal body.
    if(method === 'POST') headers.Prefer = 'resolution=merge-duplicates,return=minimal';
    return fetch(this.cfg.url.replace(/\/$/,'') + '/rest/v1/' + path, {
      method, headers,
      body: body===undefined ? undefined : JSON.stringify(body),
    });
  },

  async loadAll(){
    const out = {};
    for(const key of ['athletes','games','pitches']){
      const res = await this.req('GET', SB_TABLES[key].table + '?select=*');
      if(!res.ok) throw new Error(key+' read failed: '+res.status+' '+(await res.text()).slice(0,180));
      out[key] = (await res.json()).map(fromRow);
    }
    return out;
  },

  async put(coll, id, data){
    const res = await this.req('POST', SB_TABLES[coll].table, [toRow({...data, id})]);
    if(!res.ok) throw new Error('write failed: '+res.status+' '+(await res.text()).slice(0,180));
  },

  async del(coll, id){
    const res = await this.req('DELETE', SB_TABLES[coll].table + '?id=eq.' + encodeURIComponent(id));
    if(!res.ok) throw new Error('delete failed: '+res.status);
  },

  // Polling stands in for a subscription: fetch, compare, notify on change.
  watch(coll, cb){
    let last = null;
    const tick = async ()=>{
      try{
        const res = await this.req('GET', SB_TABLES[coll].table + '?select=*');
        if(!res.ok) return;
        const rows = (await res.json()).map(fromRow);
        const sig = JSON.stringify(rows.map(r=>r.id).sort()) + '|' + rows.length;
        if(sig !== last){ last = sig; cb(rows); }
      }catch(e){ /* offline; the next tick retries */ }
    };
    const t = setInterval(tick, SB_POLL_MS);
    this.timers.push(t);
    return ()=>clearInterval(t);
  },
};

/* Supabase Auth over plain REST. Two ways in, because the free tier will not
   let you edit the email template without paying for custom SMTP:

   - The LINK. The stock email sends a magic link. Clicking it lands back here
     with the session in the URL fragment, which `consumeAuthHash` picks up.
     This needs no template edit and no SMTP, so it is the default path.
   - The CODE. If someone does add SMTP and puts {{ .Token }} in the template,
     the six-digit box still works. Kept as a fallback, not the main road. */
function siteRedirect(){
  return location.origin + location.pathname;
}
/* Password sign-in. No email is sent, so nothing is rate limited and a coach is
   never stuck waiting on an inbox. Being signed in is still not the same as
   being allowed in: the coaches table decides that, and row-level security
   enforces it, so someone who creates a password but is not on the list reads
   exactly nothing. */
async function sbPassword(url, anonKey, email, password, mode){
  const base = url.replace(/\/$/,'');
  const path = mode==='signup' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
  const res = await fetch(base + path, {
    method:'POST',
    headers:{apikey:anonKey, 'Content-Type':'application/json'},
    body: JSON.stringify({email, password}),
  });
  const body = await res.json().catch(()=>({}));

  if(!res.ok || (!body.access_token && mode!=='signup')){
    const raw = body.msg || body.error_description || body.message || body.error || '';
    throw new Error(friendlyAuthError(raw, mode));
  }
  // Signup returns a session only when Supabase is not holding out for an
  // email confirmation. If it is, say so plainly -- that setting is the cause.
  if(!body.access_token){
    throw new Error('Account created, but Supabase is set to require email confirmation. '
      + 'Turn off Authentication -> Sign In / Providers -> Email -> Confirm email, then sign in.');
  }
  return body;
}

function friendlyAuthError(raw, mode){
  const t = String(raw).toLowerCase();
  if(t.includes('invalid login credentials')) return 'That email and password do not match. Check both, or create a password if this is your first time.';
  if(t.includes('already registered') || t.includes('already been registered')) return 'That email already has a password. Use Sign in instead.';
  if(t.includes('email not confirmed')) return 'Supabase is waiting on an email confirmation for this account. Turn off Confirm email in Authentication settings, then sign in.';
  if(t.includes('password should be')) return 'That password is too short -- use at least 8 characters.';
  if(t.includes('rate limit')) return 'Too many attempts just now. Wait a minute and try again.';
  return raw || (mode==='signup' ? 'Could not create that account.' : 'Could not sign in.');
}

async function sbSendLink(url, anonKey, email, redirectTo){
  const res = await fetch(
    url.replace(/\/$/,'') + '/auth/v1/otp?redirect_to=' + encodeURIComponent(redirectTo),
    {
      method:'POST',
      headers:{apikey:anonKey, 'Content-Type':'application/json'},
      body: JSON.stringify({email, create_user:true}),
    });
  if(!res.ok){
    const t = (await res.text()).slice(0,300);
    let msg = t;
    try{ const j = JSON.parse(t); msg = j.msg || j.error_description || j.message || t; }catch(e){}
    throw new Error(msg || 'could not send the email');
  }
}

/* Read a session handed back by a magic link, then scrub it out of the address
   bar so the tokens are not left sitting in history or a shared screenshot. */
function consumeAuthHash(){
  const h = location.hash || '';
  if(!h.includes('access_token') && !h.includes('error')) return null;
  const p = new URLSearchParams(h.replace(/^#/, ''));
  const clean = ()=>{ try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} };

  const err = p.get('error_description') || p.get('error');
  if(err){ clean(); return {error: decodeURIComponent(err).replace(/\+/g,' ')}; }

  const access_token = p.get('access_token');
  if(!access_token){ clean(); return null; }
  const session = {
    access_token,
    refresh_token: p.get('refresh_token') || null,
    expires_at: p.get('expires_at') || null,
  };
  try{ localStorage.setItem(SB_SESSION, JSON.stringify(session)); }catch(e){}
  clean();
  return {session};
}
async function sbVerifyCode(url, anonKey, email, token){
  const res = await fetch(url.replace(/\/$/,'') + '/auth/v1/verify', {
    method:'POST',
    headers:{apikey:anonKey, 'Content-Type':'application/json'},
    body: JSON.stringify({type:'email', email, token}),
  });
  const body = await res.json().catch(()=>({}));
  if(!res.ok || !body.access_token) throw new Error(body.msg || body.error_description || 'that code did not work');
  return body;
}

/* --- implementation C: browser-only fallback ---
   Used when the page runs outside claude.ai, or when the viewer
   declines the db grant. Same methods, localStorage underneath,
   so the app is fully usable and nothing is silently lost. */
const localStore = {
  name:'local-only',
  async init(){ return true; },
  async loadAll(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {athletes:[],games:[],pitches:[]}; }
    catch(e){ return {athletes:[],games:[],pitches:[]}; }
  },
  async put(){ persistCache(); },
  async del(){ persistCache(); },
  watch(){ return null; },
};

let store = localStore;

/* ---------- in-memory state ----------
   The whole dataset is small (a full season is a few thousand
   pitches), so it lives in memory and every view computes from
   it. Writes update memory first, then the store. */
const S = {
  athletes:[], games:[], pitches:[],
  tab:'live',
  liveGameId:null,
  pending:{zone:null, pt:null},       // half-entered pitch on the tracking screen
  activeLineup:'A',
  athleteId:null,                      // hitter page selection
  reportGameId:null,
  filters:{gameType:'game', count:'all', pt:'all', hand:'all', from:'', to:''},
  hmMetric:'density',
  ready:false, online:false,
};

function persistCache(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      athletes:S.athletes, games:S.games, pitches:S.pitches
    }));
  }catch(e){ /* quota or private mode -- the db copy is authoritative anyway */ }
}

/* ---------- write queue ----------
   A dead wifi spot in the dugout must not lose a pitch. Every
   write is applied to memory and localStorage immediately, then
   pushed to the store. Failures land in a queue that is retried
   on the next write and on `online`. */
let queue = [];
try{ queue = JSON.parse(localStorage.getItem(LS_QUEUE)) || []; }catch(e){ queue = []; }
function saveQueue(){
  try{ localStorage.setItem(LS_QUEUE, JSON.stringify(queue)); }catch(e){}
  setSync();
}

/* Documents this device is mid-write on. A snapshot that arrives while a
   write is in flight carries the OLD version of the document, and adopting
   it would silently undo the edit the coach just made -- a substitution
   snapping back to the previous hitter, for instance. Local wins until the
   write settles. */
const inflight = new Set();

/* Ids this device has deleted. A snapshot taken before the delete landed still
   lists the row, and adopting it would resurrect a pitch the coach just undid
   -- or leave half a deleted game lying around. Ids are unique and never
   reused, so a tombstone is safe to keep for the session. */
const tombstones = new Set();

async function write(coll,id,data){
  persistCache();
  if(store === localStore) return;
  inflight.add(id);
  try{
    await store.put(coll,id,data);
    if(queue.length) flushQueue();
  }catch(e){
    queue.push({coll,id,data,op:'put'});
    saveQueue();
  }finally{
    inflight.delete(id);
  }
  setSync();
}
async function remove(coll,id){
  tombstones.add(id);
  persistCache();
  if(store === localStore) return;
  inflight.add(id);
  try{ await store.del(coll,id); }
  catch(e){ queue.push({coll,id,op:'del'}); saveQueue(); }
  finally{ inflight.delete(id); }
  setSync();
}
let flushing = false;
async function flushQueue(){
  if(flushing || !queue.length || store===localStore) return;
  flushing = true;
  const batch = queue.slice();
  for(const job of batch){
    try{
      if(job.op==='del') await store.del(job.coll, job.id);
      else await store.put(job.coll, job.id, job.data);
      queue = queue.filter(q=>q!==job);
    }catch(e){ break; }
  }
  saveQueue();
  flushing = false;
}
window.addEventListener('online', flushQueue);

function setSync(){
  const el = $('#sync'); if(!el) return;
  if(store === supabaseStore && queue.length===0){
    el.className='on'; el.textContent='synced';
    return;
  }
  if(store === localStore){
    el.className='off';
    el.textContent = S.ready ? 'this device only' : 'connecting';
  }else if(queue.length){
    el.className='err'; el.textContent = queue.length+' pitch'+(queue.length>1?'es':'')+' unsent';
  }else{
    el.className='on'; el.textContent='synced';
  }
}

/* ---------- boot ---------- */
async function boot(){
  renderLogo();
  renderTabs();

  // Render immediately from the local cache so the dugout never
  // stares at a spinner, then upgrade to the shared store.
  const cached = await localStore.loadAll();
  Object.assign(S, cached);
  adoptLiveGame();
  S.ready = true;
  render();

  /* Which backend? The artifact's own database when running on claude.ai,
     otherwise Supabase if this deployment is configured for it, otherwise
     this device only. The app above the seam never knows the difference. */
  const onArtifact = typeof claude !== 'undefined' && !!claude.use;

  if(!onArtifact){
    /* Take the session out of the URL FIRST. A sign-in link can be opened on a
       device that has never been set up -- a phone, most likely -- and the token
       is single use. Banking it before the setup gate means the link is not
       burned for nothing: finish the setup and you are already signed in. */
    const handoff = consumeAuthHash();
    if(handoff && handoff.error){
      S.gate = sbConfig() ? 'signin' : 'setup';
      S.gateError = handoff.error + ' -- request a new sign-in email.';
      render();
      return;
    }
    if(!sbConfig()){ S.gate = 'setup'; render(); return; }
    if(!sbSession()){ S.gate = 'signin'; render(); return; }
    try{
      if(await supabaseStore.init()){
        store = supabaseStore;
        await adoptRemote();
        setSync();
        return;
      }
      // Say which of the two it actually was, and keep a session that is fine.
      S.gate = 'signin';
      S.gateError = supabaseStore.why();
      if(supabaseStore.reason === 'bad-token'){ try{ localStorage.removeItem(SB_SESSION); }catch(e){} }
      render();
      return;
    }catch(e){
      if(BAKED_CONFIG.url){
        S.gate = 'signin';
        S.gateError = 'Could not reach the database just now. Check your connection and try again.';
        render();
        return;
      }
      toast('Could not reach the database -- working on this device only', true);
      setSync();
      return;
    }
  }

  let db = null;
  try{ db = await claude.use('db'); }
  catch(e){ db = null; }

  if(db){
    dbStore.db = db;
    store = dbStore;
    try{
      await adoptRemote();
    }catch(e){
      store = localStore;
      toast('Could not reach shared storage -- working on this device only', true);
    }
  }
  setSync();
  render();
}

/* Pull everything from whichever shared store is active, then keep watching it. */
async function adoptRemote(){
  const remote = await store.loadAll();
  // The shared store is authoritative; local edits still in flight win.
  S.athletes = mergeRows(remote.athletes, S.athletes);
  S.games    = mergeRows(remote.games, S.games);
  S.pitches  = mergeRows(remote.pitches, S.pitches);
  persistCache();
  adoptLiveGame();
  S.online = true;
  S.gate = null;
  flushQueue();
  for(const c of ['athletes','games','pitches']){
    try{
      store.watch(c, rows=>{
        S[c] = mergeRows(rows, S[c]);
        persistCache();
        render();
        drawModal();   // an open dialog must follow the data too
      });
    }catch(e){}
  }
  render();
}

/* Remote wins, with two exceptions that would otherwise lose the coach's work:
   a row this device is still writing, and a row whose write failed and is
   sitting in the retry queue. Both keep the local copy. */
function mergeRows(remote, local){
  const localById = new Map(local.map(r=>[r.id, r]));
  const queued = new Set(queue.map(q=>q.id));
  const keepLocal = id => inflight.has(id) || queued.has(id);

  const out = remote
    .filter(r => !tombstones.has(r.id))
    .map(r => keepLocal(r.id) && localById.has(r.id) ? localById.get(r.id) : r);
  const seen = new Set(remote.map(r=>r.id));
  for(const r of local){
    if(tombstones.has(r.id)) continue;
    if(!seen.has(r.id) && keepLocal(r.id)) out.push(r);
  }
  return out;
}

function adoptLiveGame(){

<script>
/* ============================================================
   METRICS -- pure functions over arrays of pitch objects.
   No DOM, no storage, no globals beyond the lookup tables.
   These are the functions to port verbatim if this app ever
   moves to a server.
   ============================================================ */

/* ---------- expected wOBA from contact quality ---------- */

// Exit velo + launch angle -> expected wOBA, from the embedded MLB grid.
function xwobaFor(ev, la){
  if(ev==null || !isFinite(ev)) return null;
  const L = LOOKUPS;
  const i = clamp(Math.round((ev - L.ev.lo)/L.ev.step), 0, L.ev.n-1);
  if(la==null || !isFinite(la)){
    const v = L.ev_curve[i];
    return v==null ? null : v;
  }
  const j = clamp(Math.round((la - L.la.lo)/L.la.step), 0, L.la.n-1);
  const v = L.grid[i][j];
  return v==null ? null : v;
}

/* ---------- count helpers ---------- */

const COUNT_GROUPS = {
  all:      {label:'All counts', test:()=>true},
  first:    {label:'First pitch', test:p=>p.balls===0&&p.strikes===0},
  even:     {label:'Even',        test:p=>p.balls===p.strikes},
  ahead:    {label:'Hitter ahead',test:p=>p.balls>p.strikes},
  behind:   {label:'Hitter behind',test:p=>p.balls<p.strikes},
  two_k:    {label:'2 strikes',   test:p=>p.strikes===2},
  three_b:  {label:'3 balls',     test:p=>p.balls===3},
};
const countKey = p => p.balls+'-'+p.strikes;

/* ---------- filtering ---------- */

function filterPitches(pitches, f){
  return pitches.filter(p=>{
    if(f.gameType!=='both' && p.gameType!==f.gameType) return false;
    if(f.pt!=='all' && p.pitchType!==f.pt) return false;
    if(f.hand!=='all' && p.pitcherHand!==f.hand) return false;
    if(f.gameId && p.gameId!==f.gameId) return false;
    if(f.from && p.date < f.from) return false;
    if(f.to   && p.date > f.to) return false;
    if(f.count!=='all'){
      const g = COUNT_GROUPS[f.count];
      if(g){ if(!g.test(p)) return false; }
      else if(countKey(p)!==f.count) return false;
    }
    return true;
  });
}

/* ---------- plate appearances ----------
   Scorebook attribution: pitch-level events (swings, chases, the
   heat map) belong to whoever saw that pitch. The PA outcome
   belongs to whoever was in the box when it ended. That is what
   makes a mid-PA pinch hitter come out right. */
function derivePAs(pitches){
  const by = new Map();
  for(const p of pitches){
    const k = p.gameId+'#'+p.paSeq;
    if(!by.has(k)) by.set(k, []);
    by.get(k).push(p);
  }
  const out = [];
  for(const [k,ps] of by){
    ps.sort((a,b)=>a.seq-b.seq);
    const last = ps[ps.length-1];
    let outcome = null;
    if(last.decision==='in_play') outcome = last.result;
    else if(last.decision==='hbp') outcome = 'HBP';
    else{
      const after = advanceCount(last);
      if(after.balls>=4) outcome = 'BB';
      else if(after.strikes>=3) outcome = 'K';
    }
    out.push({
      key:k, gameId:last.gameId, paSeq:last.paSeq, date:last.date,
      gameType:last.gameType, athleteId:last.athleteId, outcome,
      complete:outcome!=null, pitches:ps, last,
    });
  }
  return out.sort((a,b)=> (a.date<b.date?-1:a.date>b.date?1:0) || a.paSeq-b.paSeq);
}

// Count AFTER this pitch. The zone tap decides ball vs called strike.
function advanceCount(p){
  let b = p.balls, s = p.strikes;
  if(p.decision==='taken'){ if(p.inZone) s++; else b++; }
  else if(p.decision==='swing_miss') s++;
  else if(p.decision==='foul'){ if(s<2) s++; }
  return {balls:b, strikes:s};
}

/* ---------- run value of the decision ----------
   Credits the DECISION, not the outcome: every ball in play in a
   given count is scored the same, because the hitter controls
   whether to swing and not where the ball lands. */
function pitchRV(p){
  const t = LOOKUPS.count_rv[countKey(p)];
  if(!t) return null;
  if(p.decision==='in_play') return t.bip;
  if(p.decision==='hbp')     return t.hbp!=null ? t.hbp : t.ball;
  if(p.decision==='swing_miss') return t.whiff;
  if(p.decision==='foul')       return t.foul;
  return p.inZone ? t.called_strike : t.ball;   // taken
}

/* ---------- the stat line ---------- */
function computeStats(pitches, athleteId){
  const pas = derivePAs(pitches).filter(pa=> pa.complete && (!athleteId || pa.athleteId===athleteId));
  const c = {PA:pas.length, BB:0, K:0, HBP:0, SF:0, SAC:0, AB:0, H:0, TB:0,
             '1B':0,'2B':0,'3B':0,HR:0};
  for(const pa of pas){
    const o = pa.outcome;
    if(o==='BB'){ c.BB++; continue; }
    if(o==='HBP'){ c.HBP++; continue; }
    if(o==='SF'){ c.SF++; continue; }
    if(o==='SAC'){ c.SAC++; continue; }
    if(o==='K'){ c.K++; c.AB++; continue; }
    const r = RES[o];
    if(!r) continue;
    c.AB++;
    if(r.hit){ c.H++; c.TB += r.bases; c[o]++; }
  }
  const wobaDen = c.AB + c.BB + c.SF + c.HBP;
  const wobaNum = WOBA_W.uBB*c.BB + WOBA_W.HBP*c.HBP + WOBA_W['1B']*c['1B']
                + WOBA_W['2B']*c['2B'] + WOBA_W['3B']*c['3B'] + WOBA_W.HR*c.HR;

  // Expected wOBA: batted balls with an exit velo entered, plus the
  // walks/strikeouts/HBP that need no measurement. Coverage is reported
  // so a partly-tagged sample is never read as a complete one.
  let xNum = WOBA_W.uBB*c.BB + WOBA_W.HBP*c.HBP, xDen = c.BB + c.HBP + c.K, bipTot = 0, bipTag = 0;
  for(const pa of pas){
    const o = pa.outcome;
    if(o==='BB'||o==='HBP'||o==='K') continue;
    bipTot++;
    const ev = pa.last.ev, la = pa.last.la;
    const x = xwobaFor(ev, la);
    if(x!=null){ bipTag++; xNum += x; xDen++; }
  }

  const d = discipline(pitches);
  const denomAB = c.AB || 1;
  return {
    ...c,
    AVG: c.AB ? c.H/c.AB : null,
    OBP: (c.AB+c.BB+c.HBP+c.SF) ? (c.H+c.BB+c.HBP)/(c.AB+c.BB+c.HBP+c.SF) : null,
    SLG: c.AB ? c.TB/c.AB : null,
    OPS: null,  // filled below
    ISO: c.AB ? (c.TB-c.H)/c.AB : null,
    BABIP: (c.AB-c.K-c.HR+c.SF) > 0 ? (c.H-c.HR)/(c.AB-c.K-c.HR+c.SF) : null,
    Kpct: c.PA ? c.K/c.PA : null,
    BBpct: c.PA ? c.BB/c.PA : null,
    wOBA: wobaDen ? wobaNum/wobaDen : null,
    xwOBA: (xDen && bipTag) ? xNum/xDen : null,
    bipTot, bipTag,
    ...d,
  };
}
function withOPS(s){ s.OPS = (s.OBP!=null&&s.SLG!=null) ? s.OBP+s.SLG : null; return s; }

/* ---------- plate discipline + decision runs ---------- */
function discipline(pitches){
  let n=0, sw=0, iz=0, izSw=0, oz=0, ozSw=0, whiff=0, contact=0, fp=0, fpSw=0,
      rvSum=0, rvN=0, bip=0, evSum=0, evN=0, xSum=0, xN=0;
  for(const p of pitches){
    n++;
    const swung = p.decision!=='taken' && p.decision!=='hbp';
    if(swung) sw++;
    if(p.inZone){ iz++; if(swung) izSw++; } else { oz++; if(swung) ozSw++; }
    if(p.decision==='swing_miss') whiff++;
    if(p.decision==='foul'||p.decision==='in_play') contact++;
    if(p.balls===0&&p.strikes===0){ fp++; if(swung) fpSw++; }
    const rv = pitchRV(p);
    if(rv!=null){ rvSum+=rv; rvN++; }
    if(p.decision==='in_play'){
      bip++;
      if(p.ev!=null&&isFinite(p.ev)){ evSum+=p.ev; evN++; }
      const x = xwobaFor(p.ev, p.la);
      if(x!=null){ xSum+=x; xN++; }
    }
  }
  return {
    pitches:n,
    Swing: n?sw/n:null,
    ZSwing: iz?izSw/iz:null,
    Chase: oz?ozSw/oz:null,
    Whiff: sw?whiff/sw:null,
    Contact: sw?contact/sw:null,
    SwStr: n?whiff/n:null,
    ZTake: iz?(iz-izSw)/iz:null,
    FPSwing: fp?fpSw/fp:null,
    ZoneSeen: n?iz/n:null,
    DecRuns: rvN? rvSum/rvN*100 : null,   // runs per 100 pitches seen
    BIP: bip,
    EV: evN?evSum/evN:null,
    xwOBAcon: xN?xSum/xN:null,
  };
}

/* ---------- heat map ----------
   A single hitter's season lands a few hundred pitches on 169
   cells, so raw counts would be noise. Numerator and denominator
   are each smoothed with a small Gaussian kernel and then
   divided -- the correct order for a rate. Cells whose smoothed
   sample is still too thin are hatched instead of colored, so a
   one-pitch cell never reads as a hot zone. */
const HM_METRICS = {
  density: {label:'Pitch density', type:'seq', minN:0,
    tip:'Where the pitches went. Darker gold means this hitter sees more pitches there. Read it to find what a pitcher is willing to throw them.',
    num:p=>1, den:p=>1, fmt:v=>(v*100).toFixed(1)+'%', share:true},
  swing:   {label:'Swing rate', type:'div', mid:null, minN:2.5,
    tip:'How often the hitter swings at pitches in each spot. Compare the zone (inside the white box) to outside it -- gold outside the box is chasing.',
    num:p=>(p.decision!=='taken'&&p.decision!=='hbp')?1:0, den:p=>1, fmt:v=>(v*100).toFixed(0)+'%'},
  whiff:   {label:'Miss rate', type:'seq', minN:2,
    tip:'Of the swings taken in each spot, how many missed entirely. Gold is where this hitter is beaten.',
    num:p=>p.decision==='swing_miss'?1:0,
    den:p=>(p.decision!=='taken'&&p.decision!=='hbp')?1:0, fmt:v=>(v*100).toFixed(0)+'%'},
  ev:      {label:'Exit velo', type:'seq', minN:1.5,
    tip:'Average exit velocity on balls hit from each spot -- only where an exit velo was entered. Gold is where this hitter does damage.',
    num:p=>(p.decision==='in_play'&&p.ev!=null)?p.ev:0,
    den:p=>(p.decision==='in_play'&&p.ev!=null)?1:0, fmt:v=>v.toFixed(0)+' mph'},
  damage:  {label:'Expected damage', type:'seq', minN:1.5,
    tip:'Expected wOBA on contact from each spot, from exit velo and launch angle. Needs exit velo entered. Gold is where contact turns into runs.',
    num:p=>{const x=(p.decision==='in_play')?xwobaFor(p.ev,p.la):null; return x==null?0:x;},
    den:p=>(p.decision==='in_play'&&xwobaFor(p.ev,p.la)!=null)?1:0, fmt:v=>v.toFixed(3).replace(/^0/,'')},
  decruns: {label:'Decision runs', type:'div', mid:0, minN:2.5,
    tip:'Runs gained or lost per 100 pitches by the swing-or-take decision in each spot. Taking a ball is a gain, taking a strike or chasing is a loss. Credits the decision, not the result.',
    num:p=>{const rv=pitchRV(p); return rv==null?0:rv*100;},
    den:p=>pitchRV(p)==null?0:1, fmt:v=>(v>0?'+':'')+v.toFixed(1)},
};

const KERNEL = (()=>{
  const sigma = 1.15, rad = 2, k = [];
  for(let dr=-rad; dr<=rad; dr++) for(let dc=-rad; dc<=rad; dc++)
    k.push([dr, dc, Math.exp(-(dr*dr+dc*dc)/(2*sigma*sigma))]);
  return k;
})();

function heatGrid(pitches, metricKey){
  const M = HM_METRICS[metricKey];
  const rawNum = Array.from({length:GRID},()=>new Array(GRID).fill(0));
  const rawDen = Array.from({length:GRID},()=>new Array(GRID).fill(0));
  const rawCnt = Array.from({length:GRID},()=>new Array(GRID).fill(0));
  for(const p of pitches){
    const r = p.zoneRow, c = p.zoneCol;
    if(r==null||c==null||r<0||r>=GRID||c<0||c>=GRID) continue;
    rawNum[r][c] += M.num(p);
    rawDen[r][c] += M.den(p);
    rawCnt[r][c] += 1;
  }
  const cells = [];
  let lo = Infinity, hi = -Infinity;
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    let sn=0, sd=0, sc=0;
    for(const [dr,dc,w] of KERNEL){
      const rr=r+dr, cc=c+dc;
      if(rr<0||rr>=GRID||cc<0||cc>=GRID) continue;
      sn += rawNum[rr][cc]*w; sd += rawDen[rr][cc]*w; sc += rawCnt[rr][cc]*w;
    }
    let v = null;
    if(M.share){ v = sc; }
    else if(sd > 0) { v = sn/sd; }
    const thin = M.share ? sc < 0.8 : sd < M.minN;
    if(v!=null && !thin){ lo=Math.min(lo,v); hi=Math.max(hi,v); }
    cells.push({r, c, v, thin, n:rawCnt[r][c], eff:M.share?sc:sd, inZone:inZone(r,c)});
  }
  if(M.share && hi>0){ for(const cell of cells){ if(cell.v!=null) cell.v = cell.v/ (hi||1); } lo=0; hi=1; }
  return {cells, lo:isFinite(lo)?lo:0, hi:isFinite(hi)?hi:1, metric:M, total:pitches.length};
}

/* Heat colors stay inside the team palette: cool navy for cold,
   gold for hot, with a genuinely neutral slate midpoint so
   "average" does not read as either good or bad. */
function heatColor(v, g){
  if(v==null) return 'var(--navy-850)';
  const M = g.metric;
  let t;
  if(M.type==='div'){
    const mid = M.mid!=null ? M.mid : (g.lo+g.hi)/2;
    const span = Math.max(Math.abs(g.hi-mid), Math.abs(mid-g.lo)) || 1;
    t = clamp((v-mid)/span, -1, 1)*0.5 + 0.5;
  }else{
    t = g.hi>g.lo ? (v-g.lo)/(g.hi-g.lo) : 0.5;
  }
  return rampColor(clamp(t,0,1));
}
const RAMP = [[15,30,61],[27,47,88],[46,66,117],[110,124,153],[200,133,14],[249,168,26],[251,197,94],[255,236,196]];
function rampColor(t){
  const x = t*(RAMP.length-1), i = Math.floor(x), f = x-i;
  const a = RAMP[i], b = RAMP[Math.min(i+1,RAMP.length-1)];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
}
const RAMP_CSS = 'linear-gradient(to right,'+RAMP.map(c=>`rgb(${c[0]},${c[1]},${c[2]})`).join(',')+')';
</script>

/* ---------- lookups into state ---------- */
const athlete = id => S.athletes.find(a=>a.id===id);
const aName = id => { const a = athlete(id); return a ? a.name : 'Unknown'; };
const game = id => S.games.find(g=>g.id===id);
const gamePitches = gid => S.pitches.filter(p=>p.gameId===gid);
const occupant = (g, L, slot) => occupantOf(g, L, slot);

/* ---------- derived live state (nothing is stored that can drift) ---------- */
function liveState(g){
  const ps = gamePitches(g.id).slice().sort((a,b)=>a.seq-b.seq);
  const per = {};
  for(const L of ['A','B']){
    const lp = ps.filter(p=>p.lineup===L);
    const pas = derivePAs(lp);
    const done = pas.filter(pa=>pa.complete).length;
    const open = pas.find(pa=>!pa.complete) || null;
    per[L] = {
      pitches:lp, pas, batterIdx: done % 9, open,
      count: open ? advanceCount(open.pitches[open.pitches.length-1]) : {balls:0, strikes:0},
    };
  }
  return {
    ps, per,
    nextSeq: ps.length ? ps[ps.length-1].seq + 1 : 1,
    nextPA:  ps.length ? Math.max(...ps.map(p=>p.paSeq)) + 1 : 1,
  };
}

        <div class="field"><span>Counts as ${help('A real game or a scrimmage. Hitter pages show games only by default, so fall scrimmage work never muddies a spring stat line. You can always switch a page to scrimmages or both.')}</span>
          <div class="seg">
            <button data-act="setup-field" data-k="gameType" data-v="game" aria-pressed="${setup.gameType==='game'}">Game</button>
            <button data-act="setup-field" data-k="gameType" data-v="scrimmage" aria-pressed="${setup.gameType==='scrimmage'}">Scrimmage</button>
          </div>
        </div>

/* ---------- the tracking screen ---------- */
function trackScreen(g){
  const st = liveState(g);
  const L = S.activeLineup;
  const cur = st.per[L];
  const slot = cur.batterIdx;
  const batter = occupant(g, L, slot);
  const c = cur.count;
  const pend = S.pending;
  const step = !pend.zone ? 1 : (!pend.pt ? 2 : 3);

  const paPitches = cur.open ? cur.open.pitches : [];
  const seen = batter ? cur.pitches.filter(p=>p.athleteId===batter) : [];

  return `<div class="col">
    <div class="trackbar">
      <div class="batter">
        <span class="slot">${slot+1}</span>
        <span>
          <span class="nm">${esc(batter?aName(batter):'empty slot')}</span>
          <span class="meta">${batter?(athlete(batter)?.bats||'R')+'HH':''} &middot; ${seen.length} pitches today &middot; PA ${cur.pas.filter(p=>p.complete&&p.athleteId===batter).length+1}</span>
        </span>
      </div>
      <span class="count">${c.balls}-${c.strikes}<small>count</small></span>
      <div class="steps">
        <span class="s ${step>1?'done':(step===1?'now':'')}">1 zone</span>
        <span class="s ${step>2?'done':(step===2?'now':'')}">2 pitch</span>
        <span class="s ${step===3?'now':''}">3 result</span>
      </div>
      ${g.lineupMode==='dual'?`<div class="seg">
        <button data-act="set-lineup" data-l="A" aria-pressed="${L==='A'}">Side A</button>
        <button data-act="set-lineup" data-l="B" aria-pressed="${L==='B'}">Side B</button>
      </div>`:''}
      <div class="row tight" style="margin-left:auto">
        <button class="btn ghost sm" data-act="sub-open">Sub</button>
        <button class="btn ghost sm" data-act="undo"${st.ps.length?'':' disabled'}>Undo</button>
        <button class="btn danger sm" data-act="end-game">End game</button>
      </div>
    </div>

    <div class="grid2">
      <div class="panel">
        <header><h3>Where was it?</h3>
          <span class="sub">${esc(g.opponent||'--')} &middot; ${g.gameType} &middot; ${fmtDate(g.date)}</span></header>
        ${zoneGridHTML(pend.zone)}
        <p class="note" style="margin:10px 0 0">The white box is the strike zone. A taken pitch inside it is a strike, outside it a ball -- you never enter the count.</p>
      </div>

      <div class="col">
        <div class="panel">
          <header><h3>Pitch type</h3></header>
          <div class="pgrid">${PITCH_TYPES.map(p=>
            `<button data-act="pick-pt" data-v="${p.code}" class="${pend.pt===p.code?'sel':''}"${pend.zone?'':' disabled'}>
              ${p.label}<small>${esc(p.name.split(' /')[0])}</small></button>`).join('')}</div>
          <div class="row" style="margin-top:11px">
            <div class="field"><span>Pitcher throws</span>
              <div class="seg">
                ${['R','L'].map(h=>`<button data-act="set-hand" data-v="${h}" aria-pressed="${(S.hand||'R')===h}">${h}HP</button>`).join('')}
              </div>
            </div>
          </div>
        </div>
        <div class="panel">
          <header><h3>What happened?</h3></header>
          <div class="pgrid">${DECISIONS.map(d=>
            `<button data-act="pick-dec" data-v="${d.code}"${(pend.zone&&pend.pt)?'':' disabled'}>
              ${d.label}<small>${esc(d.hint)}</small></button>`).join('')}</div>
        </div>
        <div class="panel">
          <header><h3>This at-bat</h3><span class="sub">${paPitches.length} pitch${paPitches.length===1?'':'es'}</span></header>
          ${paPitches.length?`<div class="seqlog">${paPitches.map((p,i)=>{
            const a = advanceCount(p);
            const cls = p.decision==='in_play'?'bip':(p.decision!=='taken'?'sw':'');
            return `<span class="p ${cls}">${i+1} ${p.pitchType} ${decShort(p)} ${a.balls}-${a.strikes}</span>`;
          }).join('')}</div>`:`<p class="note" style="margin:0">First pitch of the at-bat.</p>`}
        </div>
      </div>
    </div>
  </div>`;
}
function decShort(p){
  if(p.decision==='taken') return p.inZone?'called K':'ball';
  if(p.decision==='swing_miss') return 'whiff';
  if(p.decision==='foul') return 'foul';
  if(p.decision==='hbp') return 'HBP';
  return p.result||'in play';
}

function zoneGridHTML(sel){
  const cells = [];
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const iz = inZone(r,c);
    const on = sel && sel.r===r && sel.c===c;
    cells.push(`<button data-act="pick-zone" data-r="${r}" data-c="${c}"
      class="${iz?'iz':''}${on?' sel':''}" aria-label="row ${r+1} column ${c+1}${iz?' in zone':''}"></button>`);
  }
  // The strike zone outline sits on the inner 7x7 of a 13x13 grid.
  const p = 10, w = 'calc(100% - 20px)';
  const lo = IZ_LO/GRID*100, hi = (IZ_HI+1)/GRID*100;
  return `<div class="zonewrap">
    <div class="zone">${cells.join('')}</div>
    <div class="szbox" style="left:calc(${p}px + ${w} * ${lo/100});top:calc(${p}px + ${w} * ${lo/100});
      width:calc(${w} * ${(hi-lo)/100});height:calc(${w} * ${(hi-lo)/100})">${SZ9}</div>
  </div>`;
}

/* ---------- substitution modal ---------- */
function subModal(){
  const g = game(S.liveGameId); if(!g) return '';
  const L = S.subSide || S.activeLineup;
  const st = liveState(g);
  const roster = S.athletes.filter(a=>a.active!==false);

  // Someone already batting elsewhere in this lineup is worth flagging, not blocking.
  const used = {};
  for(let i=0;i<9;i++){ const o = occupant(g,L,i); if(o) used[o] = (used[o]||[]).concat(i+1); }

  const rows = Array.from({length:9}, (_,i)=>{
    const cur = occupant(g, L, i);
    const hist = slotHistory(g, L, i).filter(e=>e.athleteId);
    const isUp = i===st.per[L].batterIdx;
    const dupe = cur && used[cur] && used[cur].length>1;
    return `<div class="lu">
      <span class="s">${i+1}</span>
      <select data-act="sub-pick" data-l="${L}" data-i="${i}" aria-label="Slot ${i+1} hitter">
        <option value=""${cur?'':' selected'}>-- empty --</option>
        ${roster.map(a=>
          `<option value="${a.id}"${cur===a.id?' selected':''}>${esc(a.name)}${a.number?' #'+esc(a.number):''}</option>`).join('')}
      </select>
      ${isUp?'<span class="pill gold">at bat</span>':''}
      ${dupe?`<span class="pill" style="background:var(--bad);color:var(--navy-900)">also slot ${used[cur].filter(s=>s!==i+1).join(', ')}</span>`:''}
      ${hist.length>1?`<span class="note">in for ${esc(aName(hist[hist.length-2].athleteId))}</span>`:''}
    </div>`;
  }).join('');

  return modalHTML(`Substitutions`, `
    <div class="row" style="margin-bottom:12px">
      ${g.lineupMode==='dual'?`<div class="seg">
        ${['A','B'].map(s=>`<button data-act="sub-side" data-l="${s}" aria-pressed="${L===s}">Side ${s}</button>`).join('')}
      </div>`:''}
      <span class="note" style="flex:1;min-width:220px">Pick a slot and choose the hitter. Pitches already
        thrown stay with whoever saw them -- a pinch hitter walking in at 1-2 inherits the count, not the pitches.</span>
    </div>
    <div class="lineup">${rows}</div>
    <div class="panel" style="margin-top:14px;background:var(--navy-750)">
      <h4 style="margin-bottom:8px">Hitter not on the roster?</h4>
      <div class="row" style="align-items:flex-end">
        <label class="field" style="flex:1;min-width:170px"><span>Name</span>
          <input type="text" id="sub-new-name" placeholder="First Last"></label>
        <label class="field" style="width:78px"><span>Number</span>
          <input type="text" id="sub-new-num" placeholder="21"></label>
        <div class="field"><span>Bats</span>
          <select id="sub-new-bats"><option>R</option><option>L</option><option>S</option></select></div>
        <label class="field" style="width:86px"><span>Into slot</span>
          <select id="sub-new-slot">${Array.from({length:9},(_,i)=>
            `<option value="${i}"${i===st.per[L].batterIdx?' selected':''}>${i+1}</option>`).join('')}</select></label>
        <button class="btn primary" data-act="sub-add-new" data-l="${L}">Add &amp; sub in</button>
      </div>
      <p class="note" style="margin:9px 0 0">Adds them to your roster and puts them straight into that slot.</p>
    </div>`,
    `<button class="btn primary" data-act="modal-close">Done</button>`);
}

/* ---------- field chart ---------- */
const F = {cx:200, cy:330, ppf:0.72, W:400, H:360};  // pixels per foot
const fx = x => F.cx + x*400*F.ppf;
const fy = y => F.cy - y*400*F.ppf;
function fieldHTML(points, clickable){
  const r = 400*F.ppf, ri = 95*F.ppf, b = 90*F.ppf;
  const k = Math.SQRT1_2;
  const lf = [F.cx - r*k, F.cy - r*k], rf = [F.cx + r*k, F.cy - r*k];
  const arcs = [];
  for(const [rad,col,wid] of [[r,'var(--navy-600)',1.5],[300*F.ppf,'var(--navy-700)',1],[200*F.ppf,'var(--navy-700)',1]]){
    arcs.push(`<path d="M ${F.cx-rad*k} ${F.cy-rad*k} A ${rad} ${rad} 0 0 1 ${F.cx+rad*k} ${F.cy-rad*k}"
      fill="none" stroke="${col}" stroke-width="${wid}"/>`);
  }
  return `<div class="fieldwrap"><svg viewBox="0 0 ${F.W} ${F.H}" ${clickable?'data-act="field-click"':''} role="img"
      aria-label="Spray chart of balls in play">
    <path d="M ${F.cx} ${F.cy} L ${lf[0]} ${lf[1]} A ${r} ${r} 0 0 1 ${rf[0]} ${rf[1]} Z" fill="#132B52"/>
    ${arcs.join('')}
    <path d="M ${F.cx} ${F.cy} L ${lf[0]} ${lf[1]}" stroke="var(--slate-500)" stroke-width="1.5" fill="none"/>
    <path d="M ${F.cx} ${F.cy} L ${rf[0]} ${rf[1]}" stroke="var(--slate-500)" stroke-width="1.5" fill="none"/>
    <path d="M ${F.cx} ${F.cy} L ${F.cx-b*k} ${F.cy-b*k} L ${F.cx} ${F.cy-2*b*k} L ${F.cx+b*k} ${F.cy-b*k} Z"
      fill="none" stroke="var(--gold-700)" stroke-width="1.3"/>
    <circle cx="${F.cx}" cy="${F.cy - 60.5*F.ppf}" r="2.6" fill="var(--gold-700)"/>
    <text x="${F.cx}" y="${F.cy - 200*F.ppf - 5}" fill="var(--slate-500)" font-size="9"
      font-family="IBM Plex Mono, monospace" text-anchor="middle">200</text>
    <text x="${F.cx}" y="${F.cy - 300*F.ppf - 5}" fill="var(--slate-500)" font-size="9"
      font-family="IBM Plex Mono, monospace" text-anchor="middle">300</text>
    ${points.map(p=>{
      const col = p.res==='HR' ? 'var(--gold-500)' : (p.hitFlag ? 'var(--gold-300)' : 'var(--slate-300)');
      const rr  = p.res==='HR' ? 4.4 : 3.4;
      return `<circle cx="${fx(p.x).toFixed(1)}" cy="${fy(p.y).toFixed(1)}" r="${rr}" fill="${col}"
        fill-opacity="${p.hitFlag||p.hit?0.95:0.5}" stroke="var(--navy-900)" stroke-width="0.8"/>`;
    }).join('')}
  </svg></div>`;
}

/* ---------- confirmation dialog ----------
   Deliberately NOT window.confirm(). A published page runs inside a sandboxed
   frame, where the browser refuses confirm/alert/prompt and hands back `false`
   with no error -- which read exactly like a Delete button that did nothing.
   This dialog is in-page, so it works everywhere and can offer more than a
   yes/no. Resolves with the chosen button's id, or false if dismissed. */
function askConfirm({title, body, buttons}){
  return new Promise(resolve=>{
    S.confirm = {title, body, buttons, resolve};
    openModal('confirm');
  });
}
function confirmModal(){
  const c = S.confirm;
  if(!c) return '';
  return modalHTML(c.title,
    `<div style="font-size:13.5px;line-height:1.6;color:var(--slate-100)">${c.body}</div>`,
    c.buttons.map(b=>
      `<button class="btn ${b.cls||'ghost'}" data-act="confirm-pick" data-v="${b.id}">${esc(b.label)}</button>`
    ).join(''));
}
function resolveConfirm(id){
  const c = S.confirm;
  S.confirm = null;
  closeModal();
  if(c) c.resolve(id===false ? false : id);
}

/* ---------- modal plumbing ---------- */
function modalHTML(title, body, foot){
  return `<div class="modal-backdrop" data-act="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2></header>
    ${body}
    <div class="row" style="margin-top:16px;justify-content:flex-end">${foot}</div>
  </div></div>`;
}
function openModal(kind){ S.modal = kind; drawModal(); }
function closeModal(){ S.modal = null; S.bip = null; $('#modal').innerHTML=''; }
function dismissModal(){
  // A pending confirmation must settle even when dismissed, or its caller hangs.
  if(S.confirm){ const c = S.confirm; S.confirm = null; closeModal(); c.resolve(false); return; }
  closeModal();
}
function drawModal(){
  const m = {bip:inPlayModal, sub:subModal, report:reportModal, confirm:confirmModal};
  $('#modal').innerHTML = S.modal && m[S.modal] ? m[S.modal]() : '';
}
